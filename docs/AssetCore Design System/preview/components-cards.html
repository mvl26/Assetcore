<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shell.css"></head><body><div class="card-frame">
<div class="col">
  <div class="row" style="gap:14px;align-items:stretch">
    <div style="flex:1;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:18px;box-shadow:0 1px 3px 0 rgba(0,0,0,.06)">
      <div style="font:600 13px Inter;color:#475569">Thiết bị đang vận hành</div>
      <div style="font:700 30px Manrope;letter-spacing:-0.02em;color:#0f172a;margin-top:6px">412</div>
      <div style="font:500 12px Inter;color:#059669;margin-top:4px">+ 8 so với tháng trước</div>
    </div>
    <div style="flex:1;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:18px;box-shadow:0 1px 3px 0 rgba(0,0,0,.06);position:relative;overflow:hidden">
      <div style="position:absolute;inset:0 0 auto 0;height:3px;background:#d97706;border-radius:10px 10px 0 0"></div>
      <div style="font:600 13px Inter;color:#475569">PM quá hạn</div>
      <div style="font:700 30px Manrope;letter-spacing:-0.02em;color:#0f172a;margin-top:6px">7</div>
      <div style="font:500 12px Inter;color:#d97706;margin-top:4px">Cần xử lý gấp</div>
    </div>
  </div>
  <span class="token-name">.card · .kpi-card (top stripe = --kpi-color)</span>
</div></div></body></html>
