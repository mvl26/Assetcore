<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shell.css"></head><body><div class="card-frame">
<div class="col">

    <button style="background:#2563eb;color:#fff;border:none;border-radius:7px;padding:10px 16px;font:600 15px Inter;cursor:pointer">Lưu thay đổi</button>
    <button style="background:#fff;color:#334155;border:1px solid #cbd5e1;border-radius:7px;padding:10px 16px;font:500 15px Inter;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)">Hủy</button>
    <button style="background:#dc2626;color:#fff;border:none;border-radius:7px;padding:10px 16px;font:600 15px Inter;cursor:pointer">Xoá</button>

    <button style="background:transparent;color:#475569;border:none;border-radius:7px;padding:10px 16px;font:500 15px Inter;cursor:pointer">Ghost</button>
  </div>
  <div class="row" style="gap:18px;margin-top:2px"><span class="token-name">btn-primary</span><span class="token-name">btn-secondary</span><span class="token-name">btn-danger</span><span class="token-name">btn-success</span><span class="token-name">btn-ghost</span></div>
</div></div></body></html>
