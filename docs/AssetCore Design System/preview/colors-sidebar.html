<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shell.css"></head><body><div class="card-frame">
<div class="col">
  <div class="row" style="gap:14px;align-items:stretch">
    <div style="width:240px;background:#0f1623;border-radius:8px;padding:14px 12px;color:#fff;box-shadow:4px 0 24px rgba(0,0,0,0.4)">
      <div style="font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(148,163,184,0.7);margin-bottom:10px">Chức năng module</div>
      <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:rgba(59,130,246,0.25);box-shadow:inset 3px 0 0 #3b82f6;color:#dbeafe;font-size:13px;font-weight:500">Tổng quan bảo trì</div>
      <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:rgba(255,255,255,0.78);font-size:13px;font-weight:500;margin-top:2px">Lệnh bảo trì</div>
      <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.1);color:#fff;font-size:13px;font-weight:500;margin-top:2px">Lịch bảo trì <span style="font-size:10px;color:#94a3b8">(hover)</span></div>
    </div>
    <div class="col" style="flex:1;gap:6px;justify-content:center">
      <div class="row" style="gap:8px"><div style="width:24px;height:24px;background:#0f1623;border-radius:5px"></div><span class="token-name">--sidebar-bg</span><span class="token-val">#0f1623</span></div>
      <div class="row" style="gap:8px"><div style="width:24px;height:24px;background:rgba(59,130,246,0.25);border-radius:5px;box-shadow:inset 3px 0 0 #3b82f6"></div><span class="token-name">active</span><span class="token-val">rgba(59,130,246,.25)</span></div>
      <div class="row" style="gap:8px"><div style="width:24px;height:24px;background:rgba(255,255,255,0.1);border-radius:5px;border:1px solid #e2e8f0"></div><span class="token-name">hover</span><span class="token-val">rgba(255,255,255,.10)</span></div>
      <div class="row" style="gap:8px"><div style="width:24px;height:24px;background:#dbeafe;border-radius:5px"></div><span class="token-name">active-text</span><span class="token-val">#dbeafe</span></div>
    </div>
  </div>
</div></div></body></html>
