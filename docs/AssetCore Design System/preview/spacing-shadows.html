<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shell.css"></head><body><div class="card-frame">
<div class="col">
  <div class="row" style="gap:16px;flex-wrap:wrap">
    <div style="width:200px;background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 3px 0 rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.04)">
      <div class="token-name">card</div><div class="token-val">default</div>
    </div>
    <div style="width:200px;background:#fff;border-radius:10px;padding:14px;box-shadow:0 6px 16px 0 rgba(0,0,0,.10), 0 0 0 1px rgba(0,0,0,.04)">
      <div class="token-name">card-hover</div><div class="token-val">on hover</div>
    </div>
    <div style="width:200px;background:#fff;border-radius:12px;padding:14px;box-shadow:0 8px 24px -4px rgba(0,0,0,.14), 0 0 0 1px rgba(0,0,0,.06)">
      <div class="token-name">dropdown</div><div class="token-val">menus + popovers</div>
    </div>
  </div>
  <div class="row" style="gap:16px;margin-top:4px">
    <div style="width:200px;background:#2563eb;border-radius:7px;padding:10px 14px;color:#fff;font-size:13px;font-weight:600;box-shadow:0 0 0 3px rgba(37,99,235,.20)">Focus ring</div>
    <div class="col" style="gap:4px;justify-content:center"><span class="token-name">shadow-focus</span><span class="token-val">0 0 0 3px rgba(37,99,235,.20)</span></div>
  </div>
</div></div></body></html>
