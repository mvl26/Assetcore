<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shell.css"></head><body><div class="card-frame">
<div class="col">
  <div class="row" style="gap:14px;align-items:flex-end">
    <div class="col" style="gap:6px;flex:1;align-items:center">
      <div style="width:72px;height:72px;background:#2563eb;border-radius:7px"></div>
      <div class="token-name">btn</div><div class="token-val">--radius-btn</div>
    </div><div class="col" style="gap:6px;flex:1;align-items:center">
      <div style="width:72px;height:72px;background:#2563eb;border-radius:8px"></div>
      <div class="token-name">input</div><div class="token-val">--radius-input</div>
    </div><div class="col" style="gap:6px;flex:1;align-items:center">
      <div style="width:72px;height:72px;background:#2563eb;border-radius:10px"></div>
      <div class="token-name">card</div><div class="token-val">--radius-card</div>
    </div><div class="col" style="gap:6px;flex:1;align-items:center">
      <div style="width:72px;height:72px;background:#2563eb;border-radius:12px"></div>
      <div class="token-name">modal</div><div class="token-val">--radius-modal</div>
    </div><div class="col" style="gap:6px;flex:1;align-items:center">
      <div style="width:72px;height:72px;background:#2563eb;border-radius:9999px"></div>
      <div class="token-name">pill</div><div class="token-val">--radius-pill</div>
    </div>
  </div>
</div></div></body></html>
