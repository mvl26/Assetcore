<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssetCore IMMIS — Prototype Giao diện theo Persona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   AssetCore IMMIS — Design System (theo UI-SPEC-09 v1.0)
   Tech ref: Frappe v15 + Vue 3 + Pinia + Frappe UI
   Đây là prototype HTML mô phỏng (vanilla JS).
   =========================================================== */
:root{
  /* 1.1 Color Palette */
  --color-primary-500:#0E6FFF;
  --color-primary-600:#0957D1;
  --color-primary-50:#E8F1FF;
  --color-success-500:#16A34A;
  --color-warning-500:#F59E0B;
  --color-danger-500:#DC2626;
  --color-info-500:#0891B2;
  --color-neutral-900:#0F172A;
  --color-neutral-600:#475569;
  --color-neutral-300:#CBD5E1;
  --color-neutral-100:#F1F5F9;
  --color-neutral-0:#FFFFFF;
  --color-navy-header:#1F4E79;
  /* soft backgrounds for chips */
  --success-soft:#DCFCE7; --warning-soft:#FEF3C7; --danger-soft:#FEE2E2;
  --info-soft:#CFFAFE; --primary-soft:#E8F1FF; --neutral-soft:#E2E8F0;
  /* spacing scale */
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;
  --space-8:32px;--space-12:48px;--space-16:64px;
  --radius:8px;--radius-sm:6px;--radius-lg:12px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 2px 8px rgba(15,23,42,.08);
  --shadow-lg:0 12px 32px rgba(15,23,42,.18);
  --sidebar-w:248px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter','Roboto',system-ui,sans-serif;
  font-size:16px;line-height:24px;color:var(--color-neutral-900);
  background:var(--color-neutral-100);-webkit-font-smoothing:antialiased;
}
/* Typography tokens */
.text-xs{font-size:12px;line-height:16px}
.text-sm{font-size:14px;line-height:20px}
.text-base{font-size:16px;line-height:24px}
.text-lg{font-size:20px;line-height:28px;font-weight:600}
.text-xl{font-size:24px;line-height:32px;font-weight:600}
.text-2xl{font-size:30px;line-height:38px;font-weight:700}
.muted{color:var(--color-neutral-600)}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}

/* ===================== APP SHELL ===================== */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{
  height:56px;background:var(--color-navy-header);color:#fff;display:flex;
  align-items:center;gap:var(--space-4);padding:0 var(--space-4);flex-shrink:0;z-index:40;
}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;white-space:nowrap}
.topbar .brand .logo{
  width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#0E6FFF,#16A34A);
  display:grid;place-items:center;font-size:16px;color:#fff;font-weight:800
}
.topbar .brand small{font-weight:400;opacity:.7;font-size:12px}
.topbar .spacer{flex:1}
.global-search{
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;
  border-radius:8px;padding:7px 12px;width:280px;font-size:14px
}
.global-search::placeholder{color:rgba(255,255,255,.65)}
.topbar .iconbtn{background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px;display:grid;place-items:center}
.topbar .iconbtn:hover{background:rgba(255,255,255,.24)}
.persona-pill{
  display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.22);border-radius:24px;padding:4px 6px 4px 12px;cursor:pointer
}
.persona-pill:hover{background:rgba(255,255,255,.22)}
.persona-pill .avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.persona-pill .meta{line-height:1.15;text-align:right}
.persona-pill .meta b{font-size:13px;font-weight:600}
.persona-pill .meta span{font-size:11px;opacity:.8;display:block}

.body-wrap{display:flex;flex:1;overflow:hidden}

/* ---------- Sidebar ---------- */
.sidebar{
  width:var(--sidebar-w);background:#13314f;color:#cdd9e8;flex-shrink:0;
  display:flex;flex-direction:column;transition:width .15s;overflow:hidden
}
.sidebar.collapsed{width:60px}
.sidebar .side-head{
  height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;
  background:var(--color-navy-header);font-size:12px;letter-spacing:.04em;
  text-transform:uppercase;color:#9fc3e8;font-weight:600;flex-shrink:0
}
.sidebar nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;
  font-size:14px;color:#cdd9e8;border-left:3px solid transparent;white-space:nowrap
}
.nav-item .ic{width:20px;text-align:center;font-size:15px;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(14,111,255,.22);border-left-color:var(--color-primary-500);color:#fff;font-weight:600}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#6f8aa8;padding:12px 16px 4px}
.sidebar.collapsed .nav-item span.lbl,.sidebar.collapsed .nav-group-label,.sidebar.collapsed .side-head span{display:none}
.side-foot{padding:10px 14px;font-size:11px;color:#6f8aa8;border-top:1px solid rgba(255,255,255,.08)}

/* ---------- Main content ---------- */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.breadcrumb{padding:10px 24px;font-size:12.5px;color:var(--color-neutral-600);background:var(--color-neutral-0);border-bottom:1px solid var(--color-neutral-300);display:flex;gap:6px;align-items:center;flex-shrink:0}
.breadcrumb a{color:var(--color-primary-600);text-decoration:none}
.breadcrumb .sep{color:var(--color-neutral-300)}
.page{padding:24px;max-width:1320px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head .titles{flex:1;min-width:240px}
.page-head h1{font-size:24px;line-height:32px;font-weight:700}
.page-head .sub{color:var(--color-neutral-600);font-size:14px;margin-top:3px}

/* ---------- Cards ---------- */
.card{background:var(--color-neutral-0);border:1px solid var(--color-neutral-300);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.card-pad{padding:20px}
.card-head{padding:14px 20px;border-bottom:1px solid var(--color-neutral-300);display:flex;align-items:center;gap:10px}
.card-head h3{font-size:16px;font-weight:600}
.card-head .spacer{flex:1}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}

/* KPI card */
.kpi{background:var(--color-neutral-0);border:1px solid var(--color-neutral-300);border-radius:var(--radius-lg);padding:18px;cursor:pointer;position:relative;transition:.12s;overflow:hidden}
.kpi:hover{box-shadow:var(--shadow);transform:translateY(-1px);border-color:var(--color-primary-500)}
.kpi .klabel{font-size:13px;color:var(--color-neutral-600);font-weight:500}
.kpi .kval{font-size:30px;line-height:38px;font-weight:700;margin-top:6px}
.kpi .kfoot{font-size:12px;margin-top:4px;color:var(--color-neutral-600)}
.kpi .kbar{position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi.warn .kval{color:var(--color-warning-500)} .kpi.warn .kbar{background:var(--color-warning-500)}
.kpi.danger .kval{color:var(--color-danger-500)} .kpi.danger .kbar{background:var(--color-danger-500)}
.kpi.ok .kval{color:var(--color-success-500)} .kpi.ok .kbar{background:var(--color-success-500)}
.kpi.info .kval{color:var(--color-info-500)} .kpi.info .kbar{background:var(--color-info-500)}
.kpi.primary .kval{color:var(--color-primary-600)} .kpi.primary .kbar{background:var(--color-primary-500)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;line-height:20px;white-space:nowrap}
.btn .ic{font-size:14px}
.btn-primary{background:var(--color-primary-500);color:#fff}
.btn-primary:hover{background:var(--color-primary-600)}
.btn-secondary{background:#fff;color:var(--color-neutral-900);border-color:var(--color-neutral-300)}
.btn-secondary:hover{background:var(--color-neutral-100)}
.btn-ghost{background:transparent;color:var(--color-primary-600)}
.btn-ghost:hover{background:var(--color-primary-50)}
.btn-danger{background:var(--color-danger-500);color:#fff}
.btn-danger:hover{filter:brightness(.93)}
.btn-sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- Status badges (semantic, theo 1.1) ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;line-height:16px;white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.b-commissioned{background:var(--info-soft);color:#0e7490}
.b-active{background:var(--color-success-500);color:#fff}
.b-maintenance,.b-repair,.b-pending-ver{background:var(--warning-soft);color:#b45309}
.b-calibrating{background:var(--info-soft);color:#0e7490}
.b-oos{background:var(--danger-soft);color:#b91c1c}
.b-decommissioned{background:transparent;color:var(--color-neutral-900);border:1px dashed var(--color-neutral-600)}
.b-open{background:var(--info-soft);color:#0e7490}
.b-inprogress{background:var(--warning-soft);color:#b45309}
.b-overdue{background:var(--danger-soft);color:#b91c1c}
.b-closed{background:var(--success-soft);color:#15803d}
.b-low{background:var(--neutral-soft);color:#475569}
.b-medium{background:var(--info-soft);color:#0e7490}
.b-high{background:var(--warning-soft);color:#b45309}
.b-critical{background:var(--danger-soft);color:#b91c1c}
.b-draft{background:var(--neutral-soft);color:#475569}
.b-submitted{background:var(--primary-soft);color:var(--color-primary-600)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--color-neutral-300);border-radius:var(--radius-lg);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl thead th{background:var(--color-navy-header);color:#fff;text-align:left;padding:11px 14px;font-weight:600;font-size:12.5px;white-space:nowrap;position:sticky;top:0}
table.tbl thead th .sort{opacity:.55;font-size:10px;margin-left:3px}
table.tbl tbody td{padding:11px 14px;border-bottom:1px solid var(--color-neutral-300);vertical-align:middle}
table.tbl tbody tr:nth-child(even){background:var(--color-neutral-100)}
table.tbl tbody tr:hover{background:var(--color-primary-50)}
table.tbl a.link{color:var(--color-primary-600);text-decoration:none;font-weight:600}
table.tbl a.link:hover{text-decoration:underline}
.row-danger td:first-child{box-shadow:inset 3px 0 0 var(--color-danger-500)}

/* ---------- Filter bar ---------- */
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;background:#fff;padding:12px;border:1px solid var(--color-neutral-300);border-radius:var(--radius-lg)}
.input,.select{border:1px solid var(--color-neutral-300);border-radius:8px;padding:8px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--color-neutral-900)}
.input:focus,.select:focus{outline:2px solid var(--color-primary-50);border-color:var(--color-primary-500)}
label.fld{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
label.fld .req{color:var(--color-danger-500)}
.help{font-size:12px;color:var(--color-neutral-600);margin-top:4px}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--color-neutral-300);margin-bottom:20px;flex-wrap:wrap}
.tab{padding:10px 16px;cursor:pointer;font-size:14px;font-weight:500;color:var(--color-neutral-600);border-bottom:2px solid transparent;margin-bottom:-2px}
.tab:hover{color:var(--color-primary-600)}
.tab.active{color:var(--color-primary-600);border-bottom-color:var(--color-primary-500);font-weight:600}

/* ---------- Banner / Alert ---------- */
.banner{border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:14px;margin-bottom:18px}
.banner .bic{font-size:18px;flex-shrink:0}
.banner-danger{background:var(--danger-soft);border:1px solid #fca5a5;color:#991b1b}
.banner-warn{background:var(--warning-soft);border:1px solid #fcd34d;color:#92400e}
.banner-info{background:var(--info-soft);border:1px solid #67e8f9;color:#155e75}
.banner b{font-weight:700}

/* ---------- Workflow bar ---------- */
.workflow{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:6px 0 22px}
.wf-step{display:flex;align-items:center;gap:8px}
.wf-node{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:22px;font-size:13px;font-weight:600;background:var(--color-neutral-100);color:var(--color-neutral-600);border:1px solid var(--color-neutral-300)}
.wf-node .num{width:20px;height:20px;border-radius:50%;background:var(--color-neutral-300);color:#fff;display:grid;place-items:center;font-size:11px}
.wf-node.done{background:var(--success-soft);color:#15803d;border-color:#86efac}
.wf-node.done .num{background:var(--color-success-500)}
.wf-node.current{background:var(--color-primary-500);color:#fff;border-color:var(--color-primary-600)}
.wf-node.current .num{background:#fff;color:var(--color-primary-600)}
.wf-arrow{color:var(--color-neutral-300);padding:0 8px;font-size:16px}

/* ---------- Timeline ---------- */
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--color-neutral-300)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item .tdot{position:absolute;left:-23px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--color-primary-500)}
.tl-item.ok .tdot{border-color:var(--color-success-500)}
.tl-item.warn .tdot{border-color:var(--color-warning-500)}
.tl-item.danger .tdot{border-color:var(--color-danger-500)}
.tl-item .tt{font-size:14px;font-weight:600}
.tl-item .tm{font-size:12px;color:var(--color-neutral-600)}

/* ---------- Modal / Drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:60;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:min(560px,92vw);max-height:88vh;overflow:auto}
.modal .mhead{padding:16px 20px;border-bottom:1px solid var(--color-neutral-300);display:flex;align-items:center}
.modal .mhead h3{font-size:18px;font-weight:600;flex:1}
.modal .mbody{padding:20px}
.modal .mfoot{padding:14px 20px;border-top:1px solid var(--color-neutral-300);display:flex;justify-content:flex-end;gap:10px}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,94vw);background:#fff;box-shadow:var(--shadow-lg);z-index:60;transform:translateX(100%);transition:.2s;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.drawer .dhead{padding:16px 20px;border-bottom:1px solid var(--color-neutral-300);display:flex;align-items:center;background:var(--color-navy-header);color:#fff}
.drawer .dhead h3{flex:1;font-size:16px}
.drawer .dbody{padding:20px;overflow:auto;flex:1}
.x-close{background:none;border:none;font-size:20px;cursor:pointer;color:inherit;width:30px;height:30px;border-radius:6px}
.x-close:hover{background:rgba(0,0,0,.08)}

/* ---------- Toast ---------- */
#toaster{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:10px}
.toast{background:#fff;border-left:4px solid var(--color-primary-500);box-shadow:var(--shadow-lg);border-radius:8px;padding:12px 16px;font-size:14px;min-width:260px;animation:slidein .2s}
.toast.success{border-left-color:var(--color-success-500)}
.toast.danger{border-left-color:var(--color-danger-500)}
.toast.warning{border-left-color:var(--color-warning-500)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Misc ---------- */
.pill-tag{display:inline-block;background:var(--color-neutral-100);border:1px solid var(--color-neutral-300);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--color-neutral-600)}
.kv{display:grid;grid-template-columns:200px 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--color-neutral-600)}
.kv dd{font-weight:500}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--color-neutral-600);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--color-neutral-300)}
.donut{width:160px;height:160px;border-radius:50%;flex-shrink:0}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend .li{display:flex;align-items:center;gap:8px}
.legend .sw{width:12px;height:12px;border-radius:3px}
.bars{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:10px}
.bars .bar{flex:1;background:linear-gradient(var(--color-primary-500),var(--color-primary-600));border-radius:5px 5px 0 0;position:relative;min-height:4px}
.bars .bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--color-neutral-600)}
.checklist{list-style:none}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--color-neutral-100)}
.checklist input{margin-top:4px;width:16px;height:16px;accent-color:var(--color-primary-500)}
.matrix{border-collapse:collapse;width:100%;font-size:13px}
.matrix th,.matrix td{border:1px solid var(--color-neutral-300);padding:8px 10px;text-align:center}
.matrix th{background:var(--color-neutral-100);font-weight:600}
.matrix td.dot-y{color:var(--color-success-500);font-weight:700}
.matrix td.dot-n{color:var(--color-neutral-300)}
.matrix td.cond{color:var(--color-warning-500);font-weight:700}
.matrix .rowhdr{text-align:left;background:var(--color-neutral-100);font-weight:600}
.journey{background:var(--color-primary-50);border:1px solid #bfdbfe;border-radius:12px;padding:16px 18px;margin-bottom:20px}
.journey h4{font-size:14px;font-weight:700;color:var(--color-primary-600);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.journey ol{margin-left:18px;font-size:13.5px;line-height:1.7}
.journey ol b{color:var(--color-neutral-900)}
.journey .br{color:var(--color-neutral-600);font-size:12px}
.empty-state{text-align:center;padding:48px 20px;color:var(--color-neutral-600)}
.empty-state .ic{font-size:40px;opacity:.4;margin-bottom:10px}
.qr-box{width:150px;height:150px;border:3px solid var(--color-neutral-900);border-radius:12px;display:grid;place-items:center;background:#fff;
  background-image:repeating-linear-gradient(0deg,#0F172A 0 6px,#fff 6px 12px),repeating-linear-gradient(90deg,#0F172A 0 6px,#fff 6px 12px);background-blend-mode:difference;background-size:24px 24px}
.scr-tag{display:inline-block;background:var(--color-neutral-900);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:.03em}
.prio{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px}
.prio.p1{background:var(--danger-soft);color:#b91c1c}
.prio.p2{background:var(--warning-soft);color:#b45309}
.access-note{background:#fffbeb;border:1px dashed var(--color-warning-500);border-radius:10px;padding:14px;font-size:13px;color:#92400e;display:flex;gap:10px;align-items:flex-start;margin-top:20px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.scr-chip{font-size:11px;background:var(--color-neutral-100);border:1px solid var(--color-neutral-300);border-radius:5px;padding:2px 7px;cursor:pointer}
.scr-chip:hover{background:var(--color-primary-50);border-color:var(--color-primary-500)}
.scr-chip.on{background:var(--color-primary-500);color:#fff;border-color:var(--color-primary-500)}
@media(max-width:760px){.kv{grid-template-columns:1fr}.global-search{display:none}.persona-pill .meta{display:none}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><span class="logo">A</span><div>AssetCore <small>IMMIS · BV Nhi Đồng 1</small></div></div>
    <button class="iconbtn" id="btnCollapse" title="Thu gọn menu">☰</button>
    <div class="spacer"></div>
    <input class="global-search" id="globalSearch" placeholder="🔍  Tìm mã / UDI / tên thiết bị… (Ctrl+K)">

const $ = s => document.querySelector(s);
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function statusBadge(s){
  const map={'Active':'b-active','Commissioned':'b-commissioned','Under Maintenance':'b-maintenance','Under Repair':'b-repair','Calibrating':'b-calibrating','Out of Service':'b-oos','Decommissioned':'b-decommissioned','Suspended':'b-oos'};
  const dot = s==='Active'?'<span class="dot"></span>':'';
  return `<span class="badge ${map[s]||'b-draft'}">${dot}${s}</span>`;
}
function capaBadge(s){
  const map={'Open':'b-open','In Progress':'b-inprogress','Overdue':'b-overdue','Pending Verification':'b-pending-ver','Closed':'b-closed'};
  return `<span class="badge ${map[s]||'b-draft'}">${s}</span>`;
}
function sevBadge(s){
  const map={'Low':'b-low','Medium':'b-medium','Major':'b-high','High':'b-high','Critical':'b-critical'};
  return `<span class="badge ${map[s]||'b-low'}">${s}</span>`;
}
function woBadge(s){
  const map={'Open':'b-open','In Progress':'b-inprogress','Overdue':'b-overdue','Done':'b-closed','Completed':'b-closed'};
  return `<span class="badge ${map[s]||'b-draft'}">${s}</span>`;
}
function nrBadge(s){
  const map={'Submitted':'b-submitted','Đang chấm điểm':'b-inprogress','Đã duyệt':'b-closed','Từ chối':'b-overdue','Draft':'b-draft'};
  return `<span class="badge ${map[s]||'b-draft'}">${s}</span>`;
}
function toast(msg,type='success'){
  const t=el(`<div class="toast ${type}">${msg}</div>`);
  $('#toaster').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},3000);
}
function openModal(html){ const o=$('#overlay'); o.innerHTML=`<div class="modal">${html}</div>`; o.classList.add('show'); o.onclick=e=>{if(e.target===o)closeModal();}; }
function closeModal(){ const o=$('#overlay'); o.classList.remove('show'); o.innerHTML=''; }

  const p=persona();
  const allowed=new Set(p.nav);
  const html = NAV.filter(n=>allowed.has(n.key)).map(n=>{

function highlightNav(){
  const h=location.hash||'#/dashboard';
  document.querySelectorAll('.nav-item').forEach(n=>{

    n.classList.toggle('active', r && h.startsWith(r));
  });
}
function crumb(parts){
  $('#breadcrumb').innerHTML = ['<a href="#/dashboard">Trang chủ</a>',...parts]
    .map((p,i)=> i? `<span class="sep">›</span>${p}`:p).join(' ');
}

/* ---------- ROUTER ---------- */
function route(){
  const h=(location.hash||'#/dashboard').replace('#/','');
  const [base,...rest]=h.split('/');
  const fn = SCREENS[base] || SCREENS['404'];
  // RBAC guard: if base maps to a nav key not allowed for persona -> 403
  const navKeyForBase = { assets:'assets', workorders:'workorders', pm:'pmcal', incidents:'incidents', capa:'capa', suppliers:'suppliers', inventory:'inventory', nr:'nr', procurement:'procurement', finance:'finance', reports:'reports', locations:'locations', masterdata:'masterdata', sla:'sla', audit:'audit', admin:'admin' };
  const nk = navKeyForBase[base];
  if(nk && !persona().nav.includes(nk)){ SCREENS['403'](nk); highlightNav(); return; }
  $('#view').innerHTML='';
  fn(rest);
  highlightNav();
  $('#main').scrollTop=0;
}

/* ---------- INIT ---------- */
function applyKeyboard(){
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus();}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();toast('Ctrl+S — Lưu form hiện tại','success');}
    if(e.key==='Escape'){closeModal();closeDrawer();}
    if(e.key==='?'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'){showShortcuts();}
  });
  let g=false;
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    if(e.key.toLowerCase()==='g'){g=true;setTimeout(()=>g=false,800);return;}
    if(g&&e.key.toLowerCase()==='a'){location.hash='#/assets';g=false;}
    if(g&&e.key.toLowerCase()==='d'){location.hash='#/dashboard';g=false;}
  });
}
function showShortcuts(){
  openModal(`<div class="mhead"><h3>⌨ Phím tắt</h3><button class="x-close" onclick="closeModal()">✕</button></div>
  <div class="mbody"><dl class="kv">
    <dt><span class="pill-tag">Ctrl/Cmd + S</span></dt><dd>Lưu form hiện tại</dd>
    <dt><span class="pill-tag">Ctrl/Cmd + K</span></dt><dd>Global search (mã/UDI/tên)</dd>
    <dt><span class="pill-tag">Esc</span></dt><dd>Đóng modal / drawer</dd>
    <dt><span class="pill-tag">?</span></dt><dd>Hiện bảng phím tắt</dd>
    <dt><span class="pill-tag">G → A</span></dt><dd>Go to Assets</dd>
    <dt><span class="pill-tag">G → D</span></dt><dd>Go to Dashboard</dd>
  </dl></div>`);
}
$('#btnCollapse').onclick=()=>$('#sidebar').classList.toggle('collapsed');
$('#btnShortcuts').onclick=showShortcuts;
$('#personaPill').onclick=openPersonaSwitcher;
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){toast('Tìm: '+e.target.value,'success');location.hash='#/assets';}});
renderPersonaPill();
renderSidebar();
applyKeyboard();
if(!location.hash) location.hash=persona().home;
route();
