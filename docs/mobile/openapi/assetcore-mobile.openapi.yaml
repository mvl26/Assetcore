  #   KHI cannot_repair=0); (3) nhánh cannot_repair=1 trả status="Cannot Repair" (services/imm09.py:1005,
  #   _mark_cannot_repair) ⇒ status enum gồm CẢ "Pending Inspection" (happy services/imm09.py:958) VÀ
  #   "Cannot Repair". POST-only (@frappe.whitelist(methods=['POST']) api/imm09.py:84). VERIFIED chữ-ký
  #   @api/imm09.py:85-89. Schema CloseWorkOrderRequest/Response/Envelope RIÊNG (KHÔNG reuse
  #   RepairActionResponse {name,status} — close trả thêm mttr_hours/sla_breached). Xem ADR-MOBILE-007.
  /api/method/assetcore.api.imm09.close_work_order:
    post:
      tags: [work-order]
      operationId: closeWorkOrder
      summary: '[MVP-3d] Đóng phiếu sửa chữa — POST-action lifecycle TERMINAL (→ Pending Inspection | Cannot Repair)'
      description: >
        POST-only (@frappe.whitelist(methods=['POST']) api/imm09.py:84 — KHÔNG GET, VERIFIED). Action-on-existing
        TERMINAL: KTV hoàn thành sửa chữa ⇒ chuyển "In Repair" → "Pending Inspection" (chờ nghiệm thu
        confirm_inspection — KHÔNG nhảy thẳng Completed; services/imm09.py:946,958). HOẶC khi
        cannot_repair=1: "In Repair/Diagnosing/Pending Parts/Assigned" → "Cannot Repair" (TERMINAL,
        thiết bị không cứu được → Asset Out of Service; _mark_cannot_repair services/imm09.py:1005).
        requestBody THẬT (chữ-ký VERIFIED @api/imm09.py:85-89 — close_work_order(name, repair_summary,
        root_cause_category, dept_head_name, checklist_results='[]', spare_parts='[]', firmware_updated=0,
        firmware_change_request='', cannot_repair=0, cannot_repair_reason='')): 3 positional bắt buộc
        (name, repair_summary, root_cause_category — KHÔNG default ⇒ schema-required) + dept_head_name
        (4th positional no-default ở signature NHƯNG conditional-required ở SERVICE — CM-013
        services/imm09.py:929 bắt buộc khi cannot_repair=0; cannot_repair=1 KHÔNG cần ⇒ KHÔNG ép
        schema-required; documented divergence guarded closewo_i) + 6 optional default.
        2 child-array: checklist_results[] (CloseWorkOrderChecklistInput — field-name KHÁC PM:
        test_description≠description, _apply_checklist services/imm09.py:1019-1040) + spare_parts[]
        (loose passthrough _apply_spare_parts services/imm09.py:1042). firmware_updated/cannot_repair =
        integer enum[0,1] (int()-coerce api/imm09.py:87,88 — KHÔNG boolean, chống strict-codegen crash).
        Cap: repair.submit (rbac.require api/imm09.py:90).
        Responses (route-by-VALUE body.success — pattern C6/C7, KHÔNG HTTP status-line, KHÔNG
        discriminator): 200 = oneOf [CloseWorkOrderEnvelope (success:true, data {name,status,mttr_hours,
        sla_breached}) | Error (success:false)] CLOSED-SCHEMA disjoint required-set (Decision-B §5c). Lỗi
        nghiệp vụ (BR-09 invalid-transition IMM09_BAD_STATE services/imm09.py:925 / NOT_FOUND :915 /
        IMM09_DEPT_HEAD_REQUIRED :930 / IDOR / cap-403 in-handler rbac.require api/imm09.py:90) ARRIVE
        HTTP-200 + Error body (route theo body.http_status) — gom vào nhánh Error 200-oneOf, KHÔNG
        status-line key.
        403 = SINGLE-SHAPE Forbidden (dispatcher-403 guest/no-token trip TRƯỚC handle() → HTTP-403 THẬT +
        FrappeRawError __init__.py:876). KHÁC reportIncident (DUAL-403 ReportIncidentForbidden) — in-handler
        cap-403 (rbac.require api/imm09.py:90 repair.submit) đã PHỦ bởi nhánh Error 200-oneOf, nên 403-slot
        CHỈ giữ dispatcher-403 (single-shape — mirror startRepair/startWork). 401 = Unauthorized401
        (bearer hết-hạn/invalid → HTTP-401 THẬT). Xem ADR-MOBILE-007 (04 §8.14).
      requestBody:
        required: true
        description: >
          Body đóng phiếu sửa chữa — 3 bắt buộc (name, repair_summary, root_cause_category positional
          @api/imm09.py:85). dept_head_name conditional-required (CM-013: bắt buộc khi cannot_repair=0 để
          nghiệm thu; cannot_repair=1 KHÔNG cần — documented divergence guarded closewo_i). 2 child-array:
          checklist_results[] + spare_parts[].
          content application/json (Frappe RPC /api/method đọc form_dict; client native gửi JSON với
          Content-Type:application/json — 04 §4/§9; checklist_results/spare_parts gửi như JSON-array,
          BE parse_json string api/imm09.py:91-92).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseWorkOrderRequest'
      responses:
        # C8-ACTION (route-by-VALUE C6/C7) — 200 = oneOf [CloseWorkOrderEnvelope, Error] CLOSED-SCHEMA
        #   disjoint required-set (Decision-B §5c, KHÔNG discriminator). Lỗi nghiệp vụ in-handler
        #   (invalid-transition IMM09_BAD_STATE services/imm09.py:925 / NOT_FOUND :915 / DEPT_HEAD_REQUIRED
        #   :930 / IDOR / cap-403 api/imm09.py:90) ARRIVE HTTP-200 + Error body (quirk §5: _err + handle()
        #   return dict). ⇒ gom vào nhánh Error; client route theo body.success + body.http_status.
        '200':
          description: >
            200 đóng phiếu. oneOf 2 nhánh phân biệt MÁY-ĐỌC bằng CLOSED-SCHEMA + disjoint required-set
            (KHÔNG discriminator — §5c): (a) CloseWorkOrderEnvelope {success:true, data:{name,status,
            mttr_hours,sla_breached}} — thành công (status="Pending Inspection" happy services/imm09.py:958
            HOẶC "Cannot Repair" nhánh cannot_repair _mark_cannot_repair services/imm09.py:1005);
            (b) Error envelope {success:false, code, http_status} — lỗi nghiệp vụ in-handler
            (invalid-transition / NOT_FOUND / DEPT_HEAD_REQUIRED / cap-403) arrive HTTP-200. Route theo
            body.success/body.http_status, KHÔNG HTTP status-line. 2 nhánh additionalProperties:false ⇒
            loại-trừ theo required-set (Env req[success,data] vs Error req[success,error,code,http_status]).
          content:
            application/json:
              # G-OAS-NO-BOOL-DISC (§5c) — KHÔNG discriminator (success là BOOLEAN ⇒ illegal). 2 nhánh
              #   máy-phân-biệt bằng closed-schema (additionalProperties:false cả 2) + disjoint required-set.
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CloseWorkOrderEnvelope'
                  - $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized401' }
        # C8-ACTION — 403 SINGLE-SHAPE Forbidden (dispatcher-403 guest/no-token, FrappeRawError, trip
        #   TRƯỚC handle() → HTTP-403 THẬT). KHÁC reportIncident DUAL-403: in-handler cap-403
        #   (api/imm09.py:90 rbac.require('repair.submit')) đã PHỦ bởi nhánh Error 200-oneOf ⇒ 403-slot
        #   CHỈ giữ dispatcher-403 (sạch hơn — mirror startRepair/startWork). Xem ADR-MOBILE-007.
        '403': { $ref: '#/components/responses/Forbidden' }

  # C8-ACTION (confirm_inspection) — POST-action lifecycle TERMINAL-THẬT cho Repair Work Order
  #   (Pending Inspection → Completed, docstatus 0→1). ĐÓNG dead-end CUỐI chuỗi repair: closeWorkOrder
  #   chỉ đưa WO về "Pending Inspection" (NON-terminal); getRepairWorkOrder.allowed_transitions[] (R22)
  #   ĐÃ surface CTA 'Completed' nhưng KHÔNG có endpoint để thực thi → confirm_inspection lấp đúng hố đó.
  #   Cap rbac.require('repair.submit') @api/imm09.py:105 (QA/trưởng-khoa DUYỆT chất-lượng — KHÁC
  #   repair.create KTV ⇒ gate phê-duyệt-chất-lượng riêng). POST-only (@frappe.whitelist(methods=['POST'])
  #   api/imm09.py:103 — VERIFIED, KHÔNG verb-divergence). request CHỈ {name} (đơn-field, mirror
  #   StartRepairRequest). response RIÊNG ConfirmInspectionResponse {name,status,mttr_hours,sla_breached}
  #   status INVARIANT='Completed' — shape-trùng CloseWorkOrderResponse NHƯNG enum-domain DISJOINT ⇒
  #   C3-split cross-ACTION (KHÔNG reuse). Xem ADR-MOBILE-009.
  /api/method/assetcore.api.imm09.confirm_inspection:
    post:
      tags: [work-order]
      operationId: confirmInspection
      summary: '[MVP-5d] Nghiệm thu sau sửa chữa — POST-action lifecycle TERMINAL (Pending Inspection → Completed, docstatus 0→1)'
      description: >
        POST-only (@frappe.whitelist(methods=['POST']) api/imm09.py:103 — VERIFIED, KHÔNG verb-divergence).
        Action-on-existing TERMINAL-THẬT: QA/trưởng-khoa NGHIỆM THU phiếu đã sửa xong ⇒ chuyển
        "Pending Inspection" → "Completed" (docstatus 0→1; svc.confirm_inspection services/imm09.py:1114-1119).
        ĐÓNG dead-end CUỐI chuỗi repair (closeWorkOrder chỉ đưa về Pending Inspection NON-terminal;
        getRepairWorkOrder.allowed_transitions[] surface CTA 'Completed' nhưng thiếu endpoint thực thi).
        requestBody THẬT (chữ-ký VERIFIED @api/imm09.py:104 — confirm_inspection(name)): CHỈ name BẮT BUỘC
        (positional, đơn-field, 0 optional param — mirror StartRepairRequest). content oneOf application/json +
        application/x-www-form-urlencoded (CÙNG $ref ConfirmInspectionRequest — Frappe RPC /api/method đọc
        form_dict, form-encoded mặc định hoặc Content-Type:application/json tường minh; 04 §4/§9).
        Cap: repair.submit (rbac.require api/imm09.py:105 — gate phê-duyệt-chất-lượng riêng, KHÁC repair.create
        KTV). response RIÊNG ConfirmInspectionResponse {name,status,mttr_hours,sla_breached}; status
        INVARIANT="Completed" (RepairStatus.COMPLETED @services/imm09.py:1116 — single-value/terminal).
        Schema RIÊNG (KHÔNG reuse CloseWorkOrderResponse — shape-trùng NHƯNG status enum-domain DISJOINT;
        C3-split cross-ACTION ADR-MOBILE-009, precedent ResolveIncident/CloseIncident).
        Responses (route-by-VALUE body.success — pattern C6/C7, KHÔNG HTTP status-line, KHÔNG discriminator):
        200 = oneOf [ConfirmInspectionEnvelope (success:true, data {name,status,mttr_hours,sla_breached}) |
        Error (success:false)] CLOSED-SCHEMA disjoint required-set (Decision-B §5c). Lỗi nghiệp vụ in-handler
        ARRIVE HTTP-200 + Error body (quirk §5 — gom vào nhánh Error, route theo body.http_status, KHÔNG
        status-line key): IMM09_BAD_STATE (status≠"Pending Inspection", expected="Pending Inspection" —
        code BAD_STATE/VALIDATION_ERROR) + IMM09_NOT_FOUND (WO∄, http_status=404).
        403 = SINGLE-SHAPE Forbidden (dispatcher-403 guest/no-token trip TRƯỚC handle() → HTTP-403 THẬT +
        FrappeRawError __init__.py:876). KHÁC reportIncident (DUAL-403) — in-handler cap-403 (rbac.require
        api/imm09.py:105 repair.submit) đã PHỦ bởi nhánh Error 200-oneOf, nên 403-slot CHỈ giữ dispatcher-403
        (single-shape — mirror closeWorkOrder/submitCalibration). 401 = Unauthorized401 (bearer hết-hạn/invalid
        → HTTP-401 THẬT). Xem ADR-MOBILE-009 (04 §8.20).
      requestBody:
        required: true
        description: >
          Body nghiệm thu — CHỈ name bắt buộc (positional, đơn-field @api/imm09.py:104). content oneOf
          application/json + application/x-www-form-urlencoded (CÙNG $ref ConfirmInspectionRequest) — Frappe
          RPC /api/method đọc form_dict (form-encoded mặc định, hoặc set Content-Type:application/json tường
          minh). Xem 04 §4/§9.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmInspectionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmInspectionRequest'
      responses:
        # C8-ACTION (route-by-VALUE C6/C7) — 200 = oneOf [ConfirmInspectionEnvelope, Error] CLOSED-SCHEMA
        #   disjoint required-set (Decision-B §5c, KHÔNG discriminator). Lỗi nghiệp vụ in-handler
        #   (IMM09_BAD_STATE status≠Pending Inspection / IMM09_NOT_FOUND 404 / IDOR / cap-403 api/imm09.py:105)
        #   ARRIVE HTTP-200 + Error body (quirk §5: _err + handle() return dict). ⇒ gom vào nhánh Error;
        #   client route theo body.success + body.http_status.
        '200':
          description: >
            200 nghiệm thu. oneOf 2 nhánh phân biệt MÁY-ĐỌC bằng CLOSED-SCHEMA + disjoint required-set
            (KHÔNG discriminator — §5c): (a) ConfirmInspectionEnvelope {success:true, data:{name,status,
            mttr_hours,sla_breached}} — thành công (status INVARIANT="Completed", docstatus 0→1
            services/imm09.py:1114-1119); (b) Error envelope {success:false, code, http_status} — lỗi nghiệp
            vụ in-handler (IMM09_BAD_STATE status≠"Pending Inspection" / IMM09_NOT_FOUND 404 / cap-403)
            arrive HTTP-200. Route theo body.success/body.http_status, KHÔNG HTTP status-line. 2 nhánh
            additionalProperties:false ⇒ loại-trừ theo required-set (Env req[success,data] vs Error
            req[success,error,code,http_status]).
          content:
            application/json:
              # G-OAS-NO-BOOL-DISC (§5c) — KHÔNG discriminator (success là BOOLEAN ⇒ illegal). 2 nhánh
              #   máy-phân-biệt bằng closed-schema (additionalProperties:false cả 2) + disjoint required-set.
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ConfirmInspectionEnvelope'
                  - $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized401' }
        # C8-ACTION — 403 SINGLE-SHAPE Forbidden (dispatcher-403 guest/no-token, FrappeRawError, trip
        #   TRƯỚC handle() → HTTP-403 THẬT). KHÁC reportIncident DUAL-403: in-handler cap-403
        #   (api/imm09.py:105 rbac.require('repair.submit')) đã PHỦ bởi nhánh Error 200-oneOf ⇒ 403-slot
        #   CHỈ giữ dispatcher-403 (sạch hơn — mirror closeWorkOrder/submitCalibration). Xem ADR-MOBILE-009.
        '403': { $ref: '#/components/responses/Forbidden' }

