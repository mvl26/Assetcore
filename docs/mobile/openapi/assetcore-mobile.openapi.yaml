    # ─── C-LISTREAD — 3 envelope list-read PHÂN BIỆT theo rows-key + field-set THẬT @source ───
    #   QUYẾT ĐỊNH BA (04 §6 + ADR-MOBILE-001 g): rows-key giữa 2 service layer KHÁC nhau và
    #   KHÔNG được hợp nhất round này (cấm sửa service .py). Khai envelope RIÊNG = nói ĐÚNG SỰ THẬT
    #   wire-shape cho codegen native (nếu khai 1 key chung → model deser sai key → rows rỗng).
    #   C3-split: PM/CM dùng rows-key `data` GIỐNG NHAU nhưng field-set DISJOINT ⇒ 2 envelope +
    #   2 element-schema RIÊNG (KHÔNG ép 1 UNION — đóng KNOWN-GAP roadmap §3.3 / ADR (g)).
    #     • PmWorkOrderListEnvelope (data.data[])     ← imm08 svc.list_work_orders (CHỈ field imm08).
    #     • RepairWorkOrderListEnvelope (data.data[]) ← imm09 svc.list_work_orders (CHỈ field imm09).
    #       cả 2: {"data": rows, "pagination": pg} → handle()→_ok →
    #       {"success":true,"data":{"data":[…],"pagination":{…}}}.
    #     • IncidentListEnvelope (data.items[]) ← imm12 svc.list_incidents trả
    #       {"items": rows, "pagination": pg} (imm12.py:764-770) → {"success":true,"data":{
    #       "items":[…],"pagination":{…}}}.
    #   KNOWN-GAP (Phase-E normalize): 2 rows-key (`data` vs `items`) là di sản service layer; hợp
    #   nhất về 1 key chung = Phase-E (đụng service .py + test BE). 04 §6.2 ghi rõ. Pagination
    #   sub-schema DÙNG CHUNG cho cả 2 (KHÔNG đổi).
    #   `(removed PaginatedListEnvelope — orphan cũ data.{pagination,items} chỉ KHỚP imm12, MÂU
    #    THUẪN imm08/09; thay bằng 2 envelope wired vào path → gỡ khỏi RESERVED 04 §8.2.)`
    # C3-split (ADR-MOBILE-001 (g) / roadmap §3.3 — đóng KNOWN-GAP "KHÔNG ép chung"):
