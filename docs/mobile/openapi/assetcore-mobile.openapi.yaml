        # C-REQBODY-CREATECAL — 403 SINGLE-SHAPE (rbac.require → frappe.throw PermissionError
        #   HTTP-403 status-line, imm11.py:95 + exceptions.py:35). KHÁC report_incident (dual-shape
        #   vì imm12 dùng _err(403) in-handler). ⇒ dùng component Forbidden chuẩn. 04 §4 row6/§8.6.
        #   GIỮ status-line key 403: dispatcher-403 trip TRƯỚC handle() → 403 THẬT.
        '403': { $ref: '#/components/responses/Forbidden' }
        # G-OAS-STATUSLINE — 404/409 DEMOTE thành doc-only note (KHÔNG status-line key): in-handler
        #   arrive HTTP-200 body, route theo body.http_status (NOT_FOUND=404 imm11.py:999 /
        #   CONFLICT=409 ASSET_BLOCKED CAL-008 imm11.py:1002 messages.py:860) — đã gom vào nhánh
        #   Error của 200-oneOf trên. Component NotFound404/Conflict409 = RESERVED forward-reserve.

