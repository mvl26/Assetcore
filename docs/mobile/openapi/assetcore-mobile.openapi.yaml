      type: object
      additionalProperties: false
      description: >
        Payload `data` của success envelope cho POST-action resolve (imm12.resolve_incident). SCHEMA
        RIÊNG — KHÔNG reuse IncidentActionResponse {name,status} vì service trả thêm `rca_created`
        (RCA auto-create High/Critical). SOURCE-CHARACTERIZED @services/imm12.py:530. `status` =
        Select-canonical @incident_report.json; SAU resolve = "Resolved" (_STATUS_RESOLVED
        services/imm12.py:44). CLOSED 3-key.
      properties:
        name:
          type: string
          description: 'Mã Incident Report (echo input). services/imm12.py:530.'
          example: INC-2026-00001
        status:
          type: string
          description: >
            Trạng thái incident SAU transition — Select-canonical 1:1 @incident_report.json. Sau
            resolve = "Resolved" (_STATUS_RESOLVED services/imm12.py:44). enum = đủ 7 state để codegen
            sinh đúng máy-trạng-thái.
          enum: [Open, Acknowledged, In Progress, Resolved, RCA Required, Closed, Cancelled]
          example: Resolved
        rca_created:
          type: string
          nullable: true
          description: >
            Mã RCA tự-tạo khi High/Critical (_needs_rca services/imm12.py:278 → _auto_create_rca
            services/imm12.py:1083 return rca.name @:1103). NULL khi severity Low/Medium HOẶC RCA-create
            raise (try/except giữ None services/imm12.py:519-524). Client hiển thị "Đã tạo RCA: <name>"
            nếu non-null.
          example: RCA-2026-00007
      required: [name, status, rca_created]

    # C8-ACTION (resolve_incident) — success envelope RIÊNG (KHÔNG reuse IncidentActionEnvelope vì data
