  headers:
    # Response-header read-cache (derive từ Frappe `modified`). Phase E set ở lớp bọc/middleware.
    ETag:
      description: >
        Validator read-cache (weak ETag derive từ `modified`). Client gửi lại qua If-None-Match
        để xin 304. ../07-offline-sync.md §2.2.
      schema:
        type: string
        example: 'W/"AC-ASSET-2026-00001-1717922200"'
    LastModified:
      description: >
        `modified` của doc dạng HTTP-date — fallback cho If-Modified-Since. ../07-offline-sync.md §2.2.
      schema:
        type: string
        example: 'Mon, 09 Jun 2026 10:30:00 GMT'

  schemas:
    # A3 — shape THẬT từ assetcore/utils/response.py. (data payload từng endpoint = Phase C.)
    Envelope:
      type: object
      description: >
        Success envelope chuẩn AssetCore — verified utils/response.py:79 (_ok).
        `data` shape cụ thể từng endpoint bồi ở Phase C.
      properties:
        success:
          type: boolean
          enum: [true]
          description: Luôn true cho success envelope.
        data:
          # Free-form any-type (object | array | scalar | null). OpenAPI 3.0.3:
          # `nullable` CHỈ có nghĩa khi đi kèm `type` (nullable-type-sibling rule);
          # schema KHÔNG `type` đã cho phép MỌI giá trị KỂ CẢ null → KHÔNG khai `nullable`
          # (tránh lint-error + codegen sinh field generic Object/dynamic). _ok(data=None)
          # hợp lệ (response.py:79). Shape `data` cụ thể từng endpoint bồi ở Phase C.
          description: 'Payload nghiệp vụ (object | array | scalar | null) — free-form any-type.'
      required: [success, data]
    Error:
      type: object
      # G-OAS-NO-BOOL-DISC (§5c, Self-Correction R1) — additionalProperties:false ⇒ closed-schema.
      #   MỌI key _err phát (response.py:95,:133-153) ĐÃ khai property bên dưới (success/error/code/
      #   http_status + 6 notification-extension fields/message_code/context/action_hint/severity/title)
      #   ⇒ đóng KHÔNG drop field hợp lệ nào. Đóng Error có 2 lợi ích:
      #     (1) 200-oneOf [<CreatedEnvelope> | Error] máy-phân-biệt được: CreatedEnvelope closed
      #         req[success,data] vs Error closed req[success,error,code,http_status] → disjoint
      #         required-set + closed ⇒ codegen route ĐÚNG nhánh (thay cho discriminator boolean illegal).
      #     (2) 403-oneOf [Error | FrappeRawError] (ReportIncidentForbidden) MẠNH hơn: cả 2 closed ⇒
      #         strictly mutual-exclusive theo shape (raw {exc_type} fail Error; Error fail FrappeRawError).
      #   Client VẪN route theo body.success/http_status (200-line) HOẶC HTTP status-line (403-line),
      #   closed-schema là tầng disambiguation máy-đọc. Xem 04 §5/§5b/§5c + ADR-MOBILE-001 (f).
      additionalProperties: false
      description: >
        Error envelope chuẩn AssetCore (FLAT) — verified utils/response.py:95 (_err) +
        :133-153. `error` là STRING tiếng Việt; `code`/`http_status` ở TOP-LEVEL.
        Các field optional là notification-extension (chỉ xuất hiện khi có giá trị).
        QUIRK: lỗi nghiệp vụ trả HTTP-200 + envelope này; http_status THẬT nằm TRONG body
        (xem ../04-api-contract.md §5).
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
          description: Thông điệp tiếng Việt cho user (đã render với context).
          example: Bạn không có quyền thực hiện thao tác này.
        code:
          type: string
          description: ErrorCode bucket (FE phân nhánh UX theo đây, KHÔNG parse string error).
          enum:
            - VALIDATION            # 422
            - VALIDATION_ERROR      # 400
            - BUSINESS_RULE         # 422
            - UNAUTHORIZED          # 401
            - FORBIDDEN             # 403
            - NOT_FOUND             # 404
            - CONFLICT              # 409
            - BAD_STATE             # 409
            - DUPLICATE             # 409
            - INVALID_PARAMS        # 400
            - PAYLOAD_TOO_LARGE     # 413
            - RATE_LIMITED          # 429
            - COMPLIANCE_BLOCKED    # 422
            - INTERNAL              # 500
            - INTERNAL_ERROR        # 500
          example: FORBIDDEN
        http_status:
          type: integer
          description: >
            HTTP status THẬT (nằm trong body do quirk HTTP-200 wrapper).
            Bounded enum = đúng tập distinct value BE phát ở body — derive @utils/response.py:
            union(_HTTP_FOR_CODE.values()) ∪ keys(_HTTP_TO_CODE) = {400,401,403,404,409,413,417,422,429,500},
            TRỪ 417 — 417 là KEY của _HTTP_TO_CODE map ra code BUSINESS_RULE, nhưng body.http_status
            luôn resolve qua _HTTP_FOR_CODE[BUSINESS_RULE]=422 (response.py:131) ⇒ 417 KHÔNG bao giờ
            surface ở body. Đóng route-by-VALUE asymmetry với `code` (đã typed-enum) cho codegen
            exhaustive switch. Guard DERIVE expected-set TỪ runtime, không hardcode (test_mobile_oas).
          enum:
            - 400   # VALIDATION_ERROR / INVALID_PARAMS
            - 401   # UNAUTHORIZED
            - 403   # FORBIDDEN
            - 404   # NOT_FOUND
            - 409   # CONFLICT / BAD_STATE / DUPLICATE
            - 413   # PAYLOAD_TOO_LARGE
            - 422   # VALIDATION / BUSINESS_RULE / COMPLIANCE_BLOCKED (417-key→BUSINESS_RULE→422)
            - 429   # RATE_LIMITED
            - 500   # INTERNAL / INTERNAL_ERROR
          example: 403
        # ─── OPTIONAL — notification-extension (response.py:139-153) ───
        fields:
          type: object
          additionalProperties:
            type: string
          description: 'Form validation field-level {field: msg}.'
        message_code:
          type: string
          description: Khoá lookup registry (utils/messages.py), vd MSG-IMM12-001.
        context:
          type: object
          additionalProperties: true
          description: Biến render template (i18n / live-edit).
        action_hint:
          type: string
          description: Gợi ý hành động kế tiếp cho user.
        severity:
          type: string
          enum: [error, warning, info, success, critical]
        title:
          type: string
          description: Tiêu đề ngắn cho dialog/toast.
      required: [success, error, code, http_status]
    Pagination:
      type: object
      description: >
        Khối phân trang — verified utils/pagination.py:6 (paginate). default page=1,
        page_size=20 (clamp 1..100). INVARIANT total==Σlen(items) permission-aware
        (ADR-IMM00-LIST-SCOPE). Xem ../04-api-contract.md §6.
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          description: Tổng bản ghi (permission-aware).
          example: 1430
        total_pages:
          type: integer
          description: ceil(total/page_size); =0 khi total=0.
          example: 72
        offset:
          type: integer
          description: (page-1)*page_size — derived, client KHÔNG cần gửi.
          example: 0
      required: [page, page_size, total, total_pages, offset]
    # ─── C-LISTREAD — 3 envelope list-read PHÂN BIỆT theo rows-key + field-set THẬT @source ───
    #   QUYẾT ĐỊNH BA (04 §6 + ADR-MOBILE-001 g): rows-key giữa 2 service layer KHÁC nhau và
    #   KHÔNG được hợp nhất round này (cấm sửa service .py). Khai envelope RIÊNG = nói ĐÚNG SỰ THẬT
    #   wire-shape cho codegen native (nếu khai 1 key chung → model deser sai key → rows rỗng).
    #   C3-split: PM/CM dùng rows-key `data` GIỐNG NHAU nhưng field-set DISJOINT ⇒ 2 envelope +
    #   2 element-schema RIÊNG (KHÔNG ép 1 UNION — đóng KNOWN-GAP roadmap §3.3 / ADR (g)).
    #     • PmWorkOrderListEnvelope (data.data[])     ← imm08 svc.list_work_orders (CHỈ field imm08).
    #     • RepairWorkOrderListEnvelope (data.data[]) ← imm09 svc.list_work_orders (CHỈ field imm09).
    #       cả 2: {"data": rows, "pagination": pg} → handle()→_ok →
    #       {"success":true,"data":{"data":[…],"pagination":{…}}}.
    #     • IncidentListEnvelope (data.items[]) ← imm12 svc.list_incidents trả
    #       {"items": rows, "pagination": pg} (imm12.py:764-770) → {"success":true,"data":{
    #       "items":[…],"pagination":{…}}}.
    #   KNOWN-GAP (Phase-E normalize): 2 rows-key (`data` vs `items`) là di sản service layer; hợp
    #   nhất về 1 key chung = Phase-E (đụng service .py + test BE). 04 §6.2 ghi rõ. Pagination
    #   sub-schema DÙNG CHUNG cho cả 2 (KHÔNG đổi).
    #   `(removed PaginatedListEnvelope — orphan cũ data.{pagination,items} chỉ KHỚP imm12, MÂU
    #    THUẪN imm08/09; thay bằng 2 envelope wired vào path → gỡ khỏi RESERVED 04 §8.2.)`
    # C3-split (ADR-MOBILE-001 (g) / roadmap §3.3 — đóng KNOWN-GAP "KHÔNG ép chung"):
    #   2 endpoint list_pm_work_orders / list_repair_work_orders CHIA rows-key `data` (di sản
    #   service) NHƯNG field-set DISJOINT (PM imm08 ≠ CM imm09). Trước đây 1 envelope/1 item
    #   UNION ⇒ codegen sinh model trộn PM+CM (nhơn 30 field optional, integrator KHÔNG biết
    #   field nào thuộc loại nào). C3-split: 2 envelope RIÊNG, mỗi cái $ref item-schema RIÊNG,
    #   field-disjoint đúng chữ-ký service (imm08.list_work_orders vs imm09.list_work_orders).
    #   rows-key `data` GIỮ NGUYÊN cả 2 (KHÔNG sửa service .py → KHÔNG reload).
    PmWorkOrderListEnvelope:
      type: object
      # C7 (open-thread #5) — additionalProperties:false ⇒ ĐÓNG ở tầng ENVELOPE để disjoint vs Error
      #   trong 200-oneOf [ListEnvelope, Error] (route-by-VALUE body.success, 0 discriminator; mirror
      #   AssetDetailEnvelope). required[success,data] vs Error required[success,error,code,http_status]
      #   ⇒ codegen route ĐÚNG nhánh. Payload BÊN TRONG data.data[] (PmWorkOrderListItem) GIỮ closed
      #   theo schema riêng — KHÔNG ảnh hưởng disjoint envelope.
      additionalProperties: false
      description: >
        Success envelope cho list PM Work Order field-tech — rows dưới key `data.data[]`.
        Verified @source imm08.py def list_work_orders → {"data":rows,"pagination":pg} →
        handle()/_ok. Element = PmWorkOrderListItem (C3-split — CHỈ field imm08, name required).
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'
            data:
              type: array
              items:
                $ref: '#/components/schemas/PmWorkOrderListItem'
              description: Mảng PM Work Order trang hiện tại (rows-key=`data`; phần tử = PmWorkOrderListItem).
          required: [pagination, data]
      required: [success, data]
    # C-LISTREAD-SCHED — envelope list PM Schedule (mirror PmWorkOrderListEnvelope, rows-key `data.data[]`).
    #   Verified @source imm08.py:984 def list_schedules → {"data":rows,"pagination":pg} → handle()/_ok.
    #   Element = PmScheduleListItem (C3-split — CHỈ field svc.list_schedules; KHÔNG ép chung PmWorkOrderListItem).
    PmScheduleListEnvelope:
      type: object
      # C7 (open-thread #5) — additionalProperties:false ⇒ ĐÓNG envelope để disjoint vs Error trong
      #   200-oneOf [ListEnvelope, Error] (mirror PmWorkOrderListEnvelope/AssetDetailEnvelope).
      additionalProperties: false
      description: >
        Success envelope cho list PM Schedule — rows dưới key `data.data[]` (mirror PmWorkOrderListEnvelope).
        Verified @source imm08.py:984 def list_schedules → {"data":rows,"pagination":pg} → handle()/_ok.
        Element = PmScheduleListItem (C3-split — CHỈ field imm08.list_schedules, name required).
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'
            data:
              type: array
              items:
                $ref: '#/components/schemas/PmScheduleListItem'
              description: Mảng PM Schedule trang hiện tại (rows-key=`data`; phần tử = PmScheduleListItem).
          required: [pagination, data]
      required: [success, data]
    RepairWorkOrderListEnvelope:
      type: object
      # C7 (open-thread #5) — additionalProperties:false ⇒ ĐÓNG envelope để disjoint vs Error trong
      #   200-oneOf [ListEnvelope, Error] (mirror PmWorkOrderListEnvelope/AssetDetailEnvelope).
      additionalProperties: false
      description: >
        Success envelope cho list Repair (CM) Work Order field-tech — rows dưới key `data.data[]`.
        Verified @source imm09.py def list_work_orders → {"data":rows,"pagination":pg} →
        handle()/_ok. Element = RepairWorkOrderListItem (C3-split — CHỈ field imm09, name required).
      properties:
        success:
