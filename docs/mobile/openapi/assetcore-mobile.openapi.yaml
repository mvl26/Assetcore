            imm12.py:359 / cap-403 imm12.py:96). Route theo body.success/body.http_status, KHÔNG
            HTTP status-line. 2 nhánh additionalProperties:false ⇒ loại-trừ theo required-set
            (Created req[success,data] vs Error req[success,error,code,http_status]).
