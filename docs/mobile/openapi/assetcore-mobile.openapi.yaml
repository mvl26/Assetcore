    # B1 — AUTH-SECTION error body (PASSTHROUGH OAuthlib, KHÔNG AssetCore Error envelope).
    #   SOURCE-CHARACTERIZED @Frappe v15.107.2 (oauthlib 3.3.1). PHÂN BIỆT RÕ:
    #     - KHÁC #/components/schemas/Error (business Error envelope {success,error,code,http_status})
    #     - KHÁC #/components/schemas/FrappeRawError của business pre-handler 401/403/429
    #       (raw exc_type/exception/exc/_server_messages — A16 đã khai schema THẬT, KHÔNG còn backlog)
    #   Union 2 shape error TỪ provider Frappe (KHÔNG wrap):
    #     (1) Grant-fail (đường THƯỜNG): oauthlib OAuth2Error.twotuples (errors.py:80-88) →
    #         {error, error_description?, error_uri?} — set tại get_token oauth2.py:132-135
    #         (`if body.error → http_status_code=400`). VD invalid_grant (errors.py:301, status 400):
    #         wrong PKCE verifier / expired code / invalid refresh.
    #     (2) Pre-body FatalClient/OAuth2Error (đường HIẾM, except oauth2.py:140-141):
    #         generate_json_error_response (oauth.py:563-575) → {description, status_code, error}.
    #   ⇒ `error` LUÔN có (key chung); 4 key còn lại optional (xuất hiện tuỳ đường).
    #   Quyết định passthrough: ../../03-auth-oauth2.md §2 + ../../04-api-contract.md §5b.
    OAuthError400:
      type: object
      description: >
        OAuth2 error body (RFC 6749 §5.2) — PASSTHROUGH NGUYÊN từ provider Frappe/oauthlib,
        KHÔNG bọc AssetCore Error envelope. Field-tech client parse theo chuẩn OAuth (`error`),
        KHÔNG dùng `code`/`http_status` của business envelope. Hai shape hợp nhất:
        đường thường = oauthlib twotuples {error, error_description?, error_uri?}
        (errors.py:80-88, set oauth2.py:132-135); đường hiếm = generate_json_error_response
        {description, status_code, error} (oauth.py:563-575). `error` là key CHUNG (luôn có).
      properties:
        error:
          type: string
          description: >
            Mã lỗi OAuth chuẩn (RFC 6749 §5.2). VD invalid_grant (wrong PKCE verifier /
            expired code / invalid refresh — errors.py:301), invalid_request, invalid_client,
            unsupported_grant_type. Client native phân nhánh theo key này (KHÔNG phải `code`).
          example: invalid_grant
        error_description:
          type: string
          description: Mô tả lỗi cho developer (oauthlib twotuples; optional — errors.py:82-83).
          example: 'Mismatching redirect URI.'
        error_uri:
          type: string
          description: URI tài liệu lỗi (oauthlib twotuples; optional — errors.py:84-85).
        description:
          type: string
          description: >
            Mô tả lỗi của đường generate_json_error_response (oauth.py:569; CHỈ xuất hiện ở
            đường pre-body FatalClient/OAuth2Error — KHÔNG cùng lúc với error_description).
        status_code:
          type: integer
          description: HTTP status của đường generate_json_error_response (oauth.py:570; optional).
          example: 400
      required: [error]
    # A16 — BUSINESS-section PRE-HANDLER raw error body (401/403/429 trip TRƯỚC handle()).
    #   SOURCE-CHARACTERIZED @Frappe v15.107.2 — API V1 (default) error builder
    #   frappe/utils/response.py::report_error + _make_logs_v1. PHÂN BIỆT RÕ 3 shape:
    #     - KHÁC #/components/schemas/Error (AssetCore business envelope {success,error,code,http_status}
    #       — CHỈ áp lỗi IN-HANDLER nghiệp vụ qua handle(), trả HTTP-200 quirk §5).
    #     - KHÁC #/components/schemas/OAuthError400 (auth-section OAuthlib passthrough).
    #   Đây là body THẬT khi pre-handler raise (KHÔNG qua _ok/_err AssetCore):
    #     - 401 AuthenticationError (frappe/exceptions.py:26-27 http_status_code=401;
    #       raise auth.py:630 khi bearer hết-hạn/invalid mà session=Guest).
    #     - 403 PermissionError (frappe/exceptions.py:34-35 http_status_code=403; raise
    #       is_whitelisted __init__.py:876 khi guest/no-token HOẶC method thiếu permission).
    #     - 429 TooManyRequestsError (frappe/exceptions.py:80 http_status_code=429) khi @rate_limit trip.
    #   Field @source frappe/utils/response.py (API V1):
    #     exc_type   = exc_type.__name__ — LUÔN set (:46) ⇒ required.
    #     exception  = dòng cuối traceback — GATED is_traceback_allowed (:43-45; vắng ở prod no-debug) ⇒ optional.
    #     exc        = JSON-encoded list traceback — GATED traceback-allowed (_make_logs_v1 :185) ⇒ optional.
    #     _server_messages = JSON-encoded list message_log — GATED message_log non-empty (:188) ⇒ optional.
    #   ⇒ Codegen sinh model KHỚP body runtime (KHÔNG deser-fail như khi $ref Error envelope).
    #   Quyết định Phase A = passthrough raw; normalize raw→envelope = OPTION Phase B (04 §5b + ADR-MOBILE-001 (e)).
    FrappeRawError:
      type: object
      description: >
        Pre-handler raw error body của Frappe (API V1) — trả khi 401/403/429 trip TRƯỚC
        AssetCore handle() (KHÔNG bọc Error envelope). SOURCE-CHARACTERIZED @Frappe
        v15.107.2 (frappe/utils/response.py::report_error :46 / _make_logs_v1 :185-188).
        Client native PHẢI dùng HTTP STATUS LINE (401/403/429 THẬT) để phân nhánh — KHÔNG
        parse như Error envelope ({success,code,http_status}). `exc_type` LUÔN có; 3 field
        traceback/message GATED dev-mode/message_log nên optional (vắng ở prod no-traceback).
      properties:
        exc_type:
          type: string
          description: >
            Tên class exception (frappe/utils/response.py:46 `exc_type.__name__`) — LUÔN có.
            VD AuthenticationError (401), PermissionError (403), TooManyRequestsError (429).
          example: PermissionError
        exception:
          type: string
          description: >
            Dòng cuối traceback (response.py:45) — CHỈ khi is_traceback_allowed (dev-mode /
            allow_error_traceback bật). Vắng ở prod no-debug.
          example: 'frappe.exceptions.PermissionError: Not permitted'
        exc:
          type: string
          description: >
            JSON-encoded list traceback (_make_logs_v1 :185) — CHỈ khi traceback-allowed.
            Là STRING (json.dumps của list), KHÔNG phải array.
        _server_messages:
          type: string
          description: >
            JSON-encoded list message_log (_make_logs_v1 :188) — CHỈ khi có message_log.
            Là STRING (json.dumps của list các json.dumps(dict)), KHÔNG phải array.
      required: [exc_type]
      # G-OAS-403-DISAMBIG (P1 contract-correctness) — closed-shape = cơ chế DISAMBIGUATION cho
      #   oneOf 403 báo hỏng (ReportIncidentForbidden = oneOf [Error | FrappeRawError]). Dispatcher-403
      #   raw {exc_type,...} (4 raw-key) KHÔNG validate-pass Error (thiếu required success/error/code/
      #   http_status); Error envelope {success,error,code,http_status,...} KHÔNG validate-pass
      #   FrappeRawError vì mang key NGOÀI {exc_type,exception,exc,_server_messages} khi
      #   additionalProperties:false ⇒ 2 nhánh oneOf LOẠI TRỪ nhau theo shape → codegen Dart/Kotlin
      #   deser route ĐÚNG nhánh (KHÔNG anyMatch ambiguity). UPDATE §5c: schemas/Error NAY CŨNG
      #   additionalProperties:false (mọi notification-extension field ĐÃ khai property → đóng không
      #   drop gì) ⇒ 403-oneOf MẠNH hơn (cả 2 nhánh closed = strictly mutual-exclusive theo shape).
      #   Client native ROUTE 403 theo HTTP STATUS-LINE THẬT (403-line=dispatcher raw re-auth /
      #   200-line=in-handler cap-403 Error show-message), additionalProperties:false là tầng phân
      #   biệt PHỤ (shape) khi cùng status. Xem 04 §5/§5b + ADR-MOBILE-001 (f).
      additionalProperties: false

