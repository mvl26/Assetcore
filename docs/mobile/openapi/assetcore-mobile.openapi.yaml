        + closed-schema phân biệt MÁY-ĐỌC với nhánh Error (success.enum:[false]) trong 200-oneOf.
        Route-by-VALUE body.success (C6/C7) — KHÔNG discriminator. RIÊNG (KHÔNG reuse IncidentActionEnvelope
        — data 3-key ≠ 2-key acknowledge/startWork).
      properties:
        success:
          type: boolean
          enum: [true]
          description: Luôn true cho nhánh action-success.
        data:
          $ref: '#/components/schemas/ResolveIncidentResponse'
      required: [success, data]

