        in-handler 422 VALIDATION (fcm_token rỗng / platform ngoài enum, mobile_device_token.py:130-137)
        ARRIVE HTTP-200 body → gom nhánh Error (KHÔNG status-line key, quirk §5). 403 = SINGLE-SHAPE
