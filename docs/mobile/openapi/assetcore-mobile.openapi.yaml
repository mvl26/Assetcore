    # =====================================================================
    # EPIC-D / D4 — DEVICE-TOKEN TYPED (gỡ 2 STUB cuối). Handler api/mobile/v1 wrap service
    #   D2 (services/mobile_device_token.py) sau bearer; GROUNDED chữ-ký service THẬT:
    #     • register_device_token(*, fcm_token, platform, device_label='', app_version='')
    #         → trả `name` (str = hash record AC Mobile Device Token) ⇒ handle()/_ok →
    #         {success:true, data:"<hash>"} (api_handler.py:48 _ok response.py:79,92).
    #         user ÉP = frappe.session.user (signature KHÔNG nhận `user`; **_ignore nuốt kwargs
    #         lạ) ⇒ KHÔNG nhận chủ-token từ client (chống spoof §6.2) → body KHÔNG có `user`.
    #     • unregister_device_token(fcm_token) → trả None ⇒ _ok(None) → {success:true, data:null}.
    #   Request: DeviceTokenRequest (fcm_token reqd · platform enum android/ios reqd ·
    #     device_label? · app_version?) — KHÔNG có `user` (server-ÉP). 200 = oneOf
    #     [<Created>, Error] CLOSED-SCHEMA disjoint required-set route-by-VALUE body.success
    #     (Decision-B §5c — KHÔNG discriminator). Xem ../06-push-fcm.md §2.3-2.5/§5.3 +
    #     completion/EPIC-D-push-fcm.md §D4 + 04 §8.7 + ../../imm-00/ADR-IMM00-OPENAPI.md §D-OAS-DEVTOK.
    # =====================================================================

    # ─── DeviceTokenRequest — body register/unregister device-token. GROUNDED chữ-ký service
    #   register_device_token (mobile_device_token.py:94-101) + DocType D1 AC Mobile Device Token.
    #   fcm_token = khóa dedup UNIQUE (reqd cả 2 op). platform enum 1:1 _VALID_PLATFORMS
    #   (mobile_device_token.py:56 = ('android','ios'), reqd cho register). device_label/app_version
    #   = optional telemetry. KHÔNG khai `user`: server ÉP frappe.session.user (chống spoof §6.2) —
    #   thêm `user` vào body = no-op (handler KHÔNG đọc; **_ignore nuốt). additionalProperties:false
    #   ⇒ codegen client KHÔNG sinh field thừa. unregister CHỈ cần fcm_token (platform/label/version
    #   bỏ qua) — DÙNG CHUNG schema (reqd=[fcm_token] đủ cho cả 2; register validate platform
    #   server-side imm-style 422 nếu thiếu). ───
    DeviceTokenRequest:
      type: object
      additionalProperties: false
      description: >
        Body đăng ký / thu hồi device-token FCM (register/unregister). GROUNDED chữ-ký
        register_device_token (mobile_device_token.py:94). `fcm_token` BẮT BUỘC (khóa dedup
        UNIQUE). `platform` enum android/ios (Select-canonical _VALID_PLATFORMS
        mobile_device_token.py:56 — BẮT BUỘC khi register; unregister bỏ qua). device_label/
        app_version = optional telemetry. KHÔNG có `user` — server ÉP frappe.session.user
        (chống spoof §6.2); client gửi `user` = bị **_ignore nuốt (no-op). Xem ../06-push-fcm.md §2.3.
      properties:
        fcm_token:
          type: string
          description: 'Registration token FCM SDK cấp (UNIQUE — khóa dedup). Bắt buộc cả register/unregister.'
        platform:
          type: string
          description: >
            Nền tảng thiết bị — Select-canonical _VALID_PLATFORMS (mobile_device_token.py:56).
            Bắt buộc khi register (422 VALIDATION nếu ngoài enum imm-style :132); unregister bỏ qua.
          enum: [android, ios]
        device_label:
          type: string
          description: 'Optional — nhãn thiết bị (đa-thiết-bị per user). default "" mobile_device_token.py:98.'
        app_version:
          type: string
          description: 'Optional — phiên bản app (telemetry). default "" mobile_device_token.py:99.'
      required: [fcm_token]

