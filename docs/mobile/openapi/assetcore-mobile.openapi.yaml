openapi: 3.0.3

# =====================================================================
# AssetCore Mobile API — SKELETON (Phase A) · auth-section BỒI (A2) · contract BỒI (A3)
# ---------------------------------------------------------------------
# Trạng thái: SKELETON. security + 3 path AUTH đã bồi params/requestBody (A2);
#   A3: Envelope/Error schema THẬT (thay stub) + Pagination/PaginatedListEnvelope
#       + responses chuẩn 401/404/409/422/429 (trỏ Error).
#   A6: COMPONENTS offline dùng-lại — parameters Idempotency-Key/If-Match/
#       If-None-Match/If-Modified-Since + headers ETag/Last-Modified +
#       response NotModified304 + reuse Conflict409. KHÔNG bồi vào path nghiệp vụ
#       (Phase C/E wire). Hợp đồng: ../07-offline-sync.md · quyết định: ../ADR-MOBILE-003.md
#   A10: operationId BỒI đủ 15/15 path (contract-identity, codegen-able). Convention
#       camelCase verbNoun = tail-của-dotted-path; verb-first cho oauth. SSoT quy tắc +
#       bảng 15 dòng: ../04-api-contract.md §8.1. Guard: assetcore/tests/test_mobile_oas.py.
#       2 device-token GIỮ NGUYÊN TÊN (chốt A5). DIFF round A10 = CHỈ thêm dòng operationId.
#   A13: ERROR-RESPONSE coverage CHẠY ĐƯỢC (failure-mode prose → contract máy-đọc).
#       (1) 401 Unauthorized401 wire lên 10 path nghiệp vụ STUB (bearer hết hạn → refresh/
#           re-auth; 04 §4 row 4 + §5 line 146-147 + ADR-MOBILE-001 e) → cùng 2 device-token
#           (đã có 401 từ A5) ⇒ TOÀN BỘ 12 path MVP declare 401. 3 auth path GIỮ NGUYÊN (302/200).
#       (2) 429 RateLimited429 wire ĐÚNG 3 path có @rate_limit THẬT: resolve_qr_token
#           (imm00.py:311) + get_asset_scan_info (imm00.py:354) + register_device_token
#           (mobile/v1/device_token.py:62 — D6, 10/60s/IP chống spam đăng ký). KHÔNG wire 429 chỗ
#           khác (chỉ 3 endpoint này có @rate_limit → 429 là sự-thật-runtime). RateLimited429 HẾT orphan
#           ⇒ gỡ khỏi RESERVED (04 §8.2) + _RESERVED_ORPHANS (test_mobile_oas.py): 11→10 orphan.
#       (3) KHÔNG wire 404/422 vòng này (phụ thuộc requestBody/asset-lookup Phase C) →
#           NotFound404 + Unprocessable422 GIỮ trong RESERVED. DIFF A13 = chỉ thêm response.
#   B1 (Phase B): AUTH-SECTION error contract = PASSTHROUGH OAuthlib (KHÔNG AssetCore envelope).
#       SOURCE-CHARACTERIZED @Frappe v15.107.2 (oauthlib 3.3.1): get_token success-body keys =
#       {access_token, expires_in, token_type=Bearer, scope?, refresh_token?} @ HTTP 200
#       (oauthlib tokens.py:309-326; set tại oauth2.py:137). Grant-fail error-body keys =
#       {error, error_description?, error_uri?} @ HTTP 400 (oauthlib errors.py:80-88 twotuples;
#       set tại oauth2.py:132-135 `if body.error → http_status_code=400`). Pre-body FatalClient/
#       OAuth2Error → generate_json_error_response shape {description, status_code, error}
#       (oauth.py:563-575). ⇒ THÊM component OAuthError400 (union 2 shape; KHÁC Error envelope
#       + KHÁC FrappeRawError business-path) + wire '400'→OAuthError400 CHỈ lên getOAuthToken
#       (grant fail: wrong PKCE verifier / expired code / invalid_grant refresh). revokeOAuthToken
#       bổ sung body-schema 200 (empty object — RFC 7009 luôn 200, oauth2.py:158-159).
#       QUYẾT ĐỊNH passthrough (Frappe core SSoT — KHÔNG wrap envelope): 03 §2 + 04 §5b.
#       KHÔNG đổi operationId (authorize/getOAuthToken/revokeOAuthToken FROZEN), KHÔNG thêm path.
#   A16: ERROR-STATUS contract fix (tách 401 vs 403 + body THẬT pre-handler).
#       (1) TÁCH status-class: 401 = Authorization header CÓ nhưng bearer hết-hạn/invalid
#           (AuthenticationError frappe/exceptions.py:26-27 status 401, raise auth.py:630);
#           403 = guest/no-token HOẶC thiếu permission/cap (PermissionError :34-35 status 403,
#           raise is_whitelisted __init__.py:876). Doc §5/§5b/§8.2 KHÔNG còn gọi A16 là 'backlog'.
#       (2) WIRE '403'→Forbidden lên TẤT CẢ 12 path MVP: 10 business STUB đã có + 2 device-token
#           (register/unregister, bearer-gated self-service 06 §2.3 → guest cũng 403). 12 path
#           declare 401 == 12 path declare 403 (đối xứng). 3 auth path KHÔNG đụng (302/200/400).
#       (3) SCHEMA body THẬT: +component FrappeRawError {exc_type req · exception?/exc?/
#           _server_messages? opt} source-char @frappe/utils/response.py V1 (exc_type :46;
#           exception :43-45 gated; exc :185; _server_messages :188). Repoint $ref của
#           Unauthorized401 + Forbidden + RateLimited429 từ schemas/Error → schemas/FrappeRawError
#           (3 response pre-handler raw, KHÔNG Error envelope) → codegen sinh model KHỚP body
#           runtime (KHÔNG deser-fail). Error envelope CHỈ áp lỗi IN-HANDLER (HTTP-200 quirk §5).
#       (4) P2 DEFER: RateLimited429 KHÔNG thêm Retry-After/X-RateLimit-* (conf.rate_limit=null →
#           rate_limiter KHÔNG instantiate rate_limiter.py:82-92 → 0 backoff-header). Typed headers
#           = Phase-B-conditional (04 §5 + open_issues). DIFF A16 = +1 schema + repoint 3 $ref +
#           wire '403' lên 2 device-token. operationId FROZEN, 0 path mới, orphan VẪN 10.
#   G-REQBODY (Phase-C): đóng 4 contract-gap codegen cho report_incident (path Phase-C đầu).
#       (gap-1 CONTENT-TYPE) ReportIncidentBody.content = oneOf application/json +
#           application/x-www-form-urlencoded (CÙNG $ref ReportIncidentRequest) — Frappe RPC
#           /api/method đọc form_dict (form-encoded mặc định; hoặc set Content-Type:application/json
#           tường minh). 04 §4/§9 note. Codegen JSON-only client KHÔNG khớp Frappe parse → field RỖNG.
#       (gap-2 403 DUAL-SHAPE) report.post '403' = oneOf Error|FrappeRawError (component
#           ReportIncidentForbidden, KHÁC Forbidden): in-handler cap-403 (HTTP-200 + Error
#           {code:FORBIDDEN}, imm12.py:96) vs dispatcher-403 (HTTP-403 status-line + FrappeRawError,
#           is_whitelisted __init__.py:876). 'in-handler cap-403 ≠ Forbidden component' — 04 §5/§5b.
#       (gap-3 vd 401→403) 04 §9 vd(d) Guest = HTTP 403 (PermissionError raw), KHÔNG 401.
#           imm12.py:91-92 `_err(401)` = DEAD-CODE over HTTP (guest trip dispatcher-403 TRƯỚC).
#       (gap-4 wire 404/422 + bồi 200) report.post +'404'→NotFound404 (asset∄,
#           IMM12_ASSET_NOT_FOUND services/imm12.py:361) + '422'→Unprocessable422 (BR-12-01
#           Critical→clinical_impact services/imm12.py:359) ⇒ GỠ CẢ 2 khỏi RESERVED (04 §8.2 +
#           _RESERVED_ORPHANS), orphan 9→7. report.post '200' rời Stub → ReportIncidentCreated
#           (data = ReportIncidentResponse {name,status,severity} — services/imm12.py:410; status
#           Select-canonical). DIFF G-REQBODY = +1 schema(ReportIncidentResponse) +2 response
#           (ReportIncidentCreated/ReportIncidentForbidden) + form-urlencoded media-type + wire
#           404/422 + repoint report 200/403. operationId FROZEN, 0 path mới, symmetry 401/403 BẤT BIẾN.
#   6 path nghiệp vụ field-tech + 3 list vẫn STUB (200→Stub) → bồi request/response chi tiết ở Phase C.
# Hợp đồng envelope/error/pagination/versioning: ../04-api-contract.md
# Auth deep-dive (sequence/TTL/scope↔cap/OAuth Client): ../03-auth-oauth2.md
# Hợp đồng giữa Frappe BE và repo native (D-STACK). KHÔNG auto-gen —
#   Frappe không sinh OpenAPI cho /api/method (whitelisted RPC).
# Envelope/ErrorCode SSoT: ../../../assetcore/utils/response.py (verified A3).
# Evidence + quyết định: ../ADR-MOBILE-001.md · ../01-architecture.md
# Verified tại Frappe v15.107.2 (oauthlib 3.3.1, site `miyano`).
# =====================================================================

info:
  title: AssetCore Mobile API
  version: 0.1.0-skeleton
  description: >
    Backend-for-mobile cho ứng dụng di động native (field-technician MVP).
    Tái dùng NGUYÊN endpoint nghiệp vụ AssetCore qua RPC /api/method/<dotted>.
    Auth = OAuth2 Authorization Code + PKCE + refresh (provider Frappe có sẵn).
    SKELETON — paths là STUB, schema chi tiết bồi ở Phase C.
    VERSIONING/DEPRECATION: namespace BỌC = api/mobile/v1 (device-token đã dùng);
    khi deprecate 1 version/endpoint, wrapper (Phase C/E) set HTTP header
    Deprecation: true + Sunset: <HTTP-date RFC 8594> (+ Link rel=successor-version);
    quy trình deprecate + ai-chạy: ../10-deploy-ops.md §5 (runbook go-live).
    Go-live deploy/ops (bật OAuth2 · CORS · public host · FCM creds · smoke curl):
    ../10-deploy-ops.md (HARD-STOP USER). KHÔNG đổi path/operationId ở Phase A.
  contact:
    name: AssetCore BA / System Architect (mobile)

servers:
  # PLACEHOLDER — Phase B set public HTTPS host (reverse-proxy + TLS + domain).
  # Hiện dev là HTTP:80 server_name rỗng (KHÔNG dùng cho mobile prod).
  - url: https://REPLACE-WITH-PUBLIC-HOST
    description: Public HTTPS host (Phase B — chưa có)
  - url: http://localhost:8000
    description: Dev gunicorn (site miyano) — chỉ local

# ---------------------------------------------------------------------
# Security scheme: OAuth2 Authorization Code + PKCE + refresh.
# URL lấy từ openid_configuration (oauth2.py:180). authorizationCode flow
# của OpenAPI 3.0.3 hỗ trợ refresh qua refreshUrl. PKCE (S256) là yêu cầu
# native (D-STACK) — verify ở frappe/oauth.py:146-160; OpenAPI 3.0.3 không
# có field PKCE tường minh nên ghi chú ở description (3.1 mới có).
# ---------------------------------------------------------------------
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: >
        Authorization Code + PKCE (S256) + refresh + revoke. Public client native
        KHÔNG nhúng client_secret → BẮT BUỘC PKCE: code_challenge =
        BASE64URL-no-pad(SHA256(code_verifier)), code_challenge_method=S256
        (verify oauth.py:146-164; nhánh plain oauth.py:166). grant_type hợp lệ =
        authorization_code | refresh_token (oauth.py:187). Access TTL default 3600s
        cố định (oauth_bearer_token.py:27-31; KHÔNG site_config knob → ADR-MOBILE-001
        A7). Refresh khi 401; refresh fail → re-auth. Revoke qua revoke_token
        (RFC 7009, oauth2.py:145). Token lưu Keychain/Keystore, KHÔNG cookie/CSRF
        (auth.py:83-98; ADR-MOBILE-001 decision e). Scope coarse on/off
        (validate_scopes oauth.py:51-54); quyền chi tiết = AssetCore rbac.py SSoT
        (97 cap) qua bearer→set_user (auth.py:667). OpenAPI 3.0.3 không có field PKCE
        tường minh → ghi ở description (3.1 mới có). Provider = frappe.integrations.oauth2.*
        SECURITY (A7 — xem ../08-security-compliance.md + ../ADR-MOBILE-004.md):
        (1) SCOPE = lớp gate THÔ on/off (oauth.py:51-56); RBAC capability + DocPerm là
        GATE CUỐI cho quyền chi tiết (deny-on-unknown-cap) — KHÔNG hệ quyền thứ 2.
        (2) Client native = PUBLIC client: KHÔNG nhúng client_secret trong APK; PKCE S256
        BẮT BUỘC. (3) Endpoint oauth2.* KHÔNG có rate-limit ở core (oauth2.py:74/123/144/205,
        grep rate_limit=0) ⇒ chặn brute-force ở tầng nginx (KHÔNG sửa frappe core).
        (4) HTTPS bắt buộc + allow_cors list-origin (CẤM '*' prod, app.py:275/283-284).
      flows:
        authorizationCode:
          authorizationUrl: /api/method/frappe.integrations.oauth2.authorize
          tokenUrl: /api/method/frappe.integrations.oauth2.get_token
          refreshUrl: /api/method/frappe.integrations.oauth2.get_token
          scopes:
            all: Toàn quyền theo capability/DocPerm của user (scope coarse)
            openid: OIDC userinfo (openid_profile)

  # ---------------------------------------------------------------------
  # A6 — Offline/Sync COMPONENTS dùng-lại (SKELETON). KHÔNG bồi vào path
  #   nghiệp vụ ở Phase A — Phase C/E wire vào path write/read.
  #   Hợp đồng đầy đủ: ../07-offline-sync.md · quyết định: ../ADR-MOBILE-003.md
  #   Mọi cơ chế = HỢP ĐỒNG cho Phase E (chưa impl ở BE).
  # ---------------------------------------------------------------------
  parameters:
    # Write-queue idempotency (../07-offline-sync.md §3). Client sinh UUIDv4/ULID;
    # BE Phase E dedupe key→first-response; replay trả response gốc (KHÔNG tạo record thứ 2).
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Khoá idempotency client-gen (UUIDv4 hoặc ULID) cho thao tác GHI. BE (Phase E) lưu
        key→first-response (TTL ~24h, per-token/user); retry trùng key → TRẢ response gốc,
        KHÔNG tạo bản ghi thứ 2. Áp 4 màn idempotent-write (báo hỏng/PM/CM/Cal) + asset-create.
        ../07-offline-sync.md §3. CHƯA impl ở BE (Phase E wire vào path write).
      schema:
        type: string
        example: 018f3a2c-6b1e-7c00-9b3a-2e1d4f5a6b7c
    # Conflict policy — optimistic-lock qua Frappe `modified` (../07-offline-sync.md §4).
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >
        Optimistic-lock: client gửi `modified` (timestamp Frappe) đã đọc; BE so với hiện tại
        → lệch ⇒ 409 CONFLICT (reuse, KHÔNG mã mới) + server-wins + báo user (KHÔNG silent-overwrite).
        Primitive: frappe.model.document.check_if_latest (document.py:850-874) → TimestampMismatchError.
        ../07-offline-sync.md §4. Phase E wire vào path UPDATE.
      schema:
        type: string
        example: '"2026-06-09 10:30:00.123456"'
    # Read-cache conditional GET (../07-offline-sync.md §2).
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >
        ETag đã cache (derive từ `modified`). BE chưa-đổi → 304 Not Modified (body rỗng) →
        app dùng cache. ../07-offline-sync.md §2. Phase E wire vào path read.
      schema:
        type: string
        example: 'W/"AC-ASSET-2026-00001-1717922200"'
    IfModifiedSince:
      name: If-Modified-Since
      in: header
      required: false
      description: >
        Fallback validator (HTTP-date của bản cache) khi không có ETag. Chưa-đổi → 304.
        ../07-offline-sync.md §2. Phase E wire vào path read.
      schema:
        type: string
        example: 'Mon, 09 Jun 2026 10:30:00 GMT'
    # ─── C-LISTREAD — pagination query-params (Phase-C list-read). Tái dùng cho 3 list ───
    #   Signature LIVE introspect: page=1 / page_size=20 ở imm08.list_pm_work_orders:28,
    #   imm09.list_repair_work_orders:21, imm12.list_incidents:197 (utils/pagination.py:7-8
    #   clamp page>=1, page_size 1..100). ../04-api-contract.md §6 + §6.1.
    Page:
      name: page
      in: query
      required: false
      description: 'Trang hiện tại (>=1). default 1; BE clamp max(page,1) (pagination.py:7).'
      schema:
        type: integer
        default: 1
        minimum: 1
        example: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 'Số item/trang. default 20; BE clamp 1..100 (pagination.py:8).'
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
        example: 20
    # imm08/09 — filter tuỳ chọn dạng JSON-string (parse_json api_handler.py:77; malformed → 400
    #   INVALID_PARAMS). Client gửi filters = JSON-encoded string. default '{}' (signature LIVE).
    WorkOrderFilters:
      name: filters
      in: query
      required: false
      description: >
        Bộ lọc dạng JSON-string (vd '{"status":"Open"}'). parse_json (api_handler.py:77) —
        malformed JSON → 400 INVALID_PARAMS. default '{}'. imm08.py:28 / imm09.py:21.
      schema:
        type: string
        default: '{}'
        example: '{"status":"Open"}'
    # C-LISTREAD-MINE-WO (A2 known-gap closure ĐỐI XỨNG — đối-xứng IncidentMine/ADR-MOBILE-015) —
    #   self-scope opt-in cho tab "...của tôi" (MyWorkOrdersView). DÙNG CHUNG 3 list (quartet phiếu-của-tôi
    #   cùng IncidentMine): list_pm_work_orders (MVP-5a, ADR-MOBILE-016) · list_repair_work_orders
    #   (MVP-5b, ADR-MOBILE-017) · list_calibrations (MVP-5d, ADR-MOBILE-019 — đóng-nốt quartet).
    #   mine=1 → filter <cột-phụ-trách>==session.user (cơ-chế THẬT, KHÔNG claim suông). CỘT scope KHÁC
    #   theo list: assigned_to cho WO PM/CM (Link User), technician cho Calibration Record (Link User,
    #   reqd — imm_asset_calibration.json:131). AND với mọi key trong filters JSON-blob. mine=0/absent =
    #   hành vi cũ UNCHANGED (web-FE PMWorkOrderListView / RepairWorkOrderListView / CalibrationListView
    #   KHÔNG đổi). count==rows giữ vì count_with_or + get_all (BaseRepository.list base.py:65-71) dùng
    #   CÙNG filters dict (đã có cột scope). Mirror shape int 0|1 với IncidentMine (né int-vs-bool trap
    #   Open#1). Inject @api-layer SAU apply_vendor_scope cả 3 (KHÁC IncidentMine seed @service — vì
    #   PM/CM/CAL filters là JSON-blob đã parse @api). 1 component, 3 $ref ⇒ 0 schema-component mới.
    WorkOrderMine:
      name: mine
      in: query
      required: false
      description: >
        mine=1 áp filter self-scope == frappe.session.user → CHỈ phiếu phụ-trách bởi chính người đăng
        nhập. CỘT scope phụ thuộc list: assigned_to cho listPmWorkOrders/listRepairWorkOrders (WO PM/CM),
        technician cho listCalibrations (Calibration Record). AND với mọi key khác trong filters JSON-blob.
        mine=0/absent = hành vi cũ (KHÔNG self-scope — permission-aware, web-FE list-view UNCHANGED).
        pagination.total == len(data.data) (cùng filters dict — count_with_or + get_all). default 0. DÙNG
        CHUNG 3 list (C3-split element RIÊNG; quartet phiếu-của-tôi cùng IncidentMine reported_by):
        listPmWorkOrders tab "Phiếu PM của tôi" (MVP-5a — api/imm08.py::list_pm_work_orders, assigned_to,
        ADR-MOBILE-016) · listRepairWorkOrders tab "Phiếu CM của tôi" (MVP-5b —
        api/imm09.py::list_repair_work_orders, assigned_to, ADR-MOBILE-017) · listCalibrations tab "Phiếu
        hiệu chuẩn của tôi" (MVP-5d — api/imm11.py::list_calibrations, technician, ADR-MOBILE-019). Cả 3
        inject f['<cột>']=session.user SAU apply_vendor_scope → svc layer.
      schema:
        type: integer
        default: 0
        enum: [0, 1]
    # imm12 — filter rời (KHÔNG gói JSON): status/severity/asset string + open int 0|1
    #   (open=1 áp open_incident_filter SoT cho drill dashboard — imm12.py:206-208).
    IncidentStatus:
      name: status
      in: query
      required: false
      description: 'Lọc theo trạng thái incident (Select). default "" (không lọc). imm12.py:198.'
      schema:
        type: string
        default: ''
    IncidentSeverity:
      name: severity
      in: query
      required: false
      description: 'Lọc theo mức độ (Low/Medium/High/Critical). default "". imm12.py:199.'
      schema:
        type: string
        default: ''
    IncidentAsset:
      name: asset
      in: query
      required: false
      description: 'Lọc theo asset (Link AC Asset name). default "". imm12.py:200.'
      schema:
        type: string
        default: ''
    IncidentOpen:
      name: open
      in: query
      required: false
      description: >
        open=1 áp open_incident_filter() SoT (incident đang mở) cho drill-down dashboard
        (count==rows). status đơn lẻ ưu tiên hơn open. default 0. imm12.py:201,206-208.
      schema:
        type: integer
        default: 0
        enum: [0, 1]
    # C-LISTREAD-MINE (A2 known-gap closure) — scope reported_by cho tab "Báo hỏng của tôi"
    #   (MyWorkOrdersView › MVP-5c). mine=1 → filter reported_by==session.user (cơ-chế THẬT,
    #   KHÔNG claim suông). AND với status/severity/asset/open KỂ CẢ nhánh status return-sớm.
    #   mine=0/absent = hành vi cũ UNCHANGED (web-FE IncidentListView KHÔNG đổi). count==rows
    #   giữ vì frappe.db.count + get_all dùng CÙNG filters dict (đã có reported_by). Quyết định:
    #   ADR-MOBILE-015. Mirror shape int 0|1 với IncidentOpen (né int-vs-bool trap Open#1).
    IncidentMine:
      name: mine
      in: query
      required: false
      description: >
        mine=1 áp filter reported_by == frappe.session.user (tab "Báo hỏng của tôi" —
        MyWorkOrdersView, MVP-5c) → CHỈ incident do chính người đăng nhập tạo. AND với
        status/severity/asset/open (KỂ CẢ nhánh status return-sớm). mine=0/absent = hành vi
        cũ (KHÔNG scope reported_by — permission-aware, web-FE UNCHANGED). pagination.total ==
        len(items) (cùng filters dict). default 0. imm12.py (param `mine`) +
        services/imm12.py::_build_incident_filters (seed `reported_by`). ADR-MOBILE-015.
      schema:
        type: integer
        default: 0
        enum: [0, 1]
    # ─── C-LISTREAD-SCHED — listPmSchedules filter params (DISCRETE, KHÔNG JSON filters) ───
    #   Chữ-ký LIVE: imm08.list_pm_schedules(asset_ref=None, status=None, page=1, page_size=20)
    #   (imm08.py:122). svc.list_schedules build filters từ asset_ref/status rời (imm08.py:986-990).
    #   KHÁC WorkOrderFilters (JSON-string) — 2 param string rời, optional. Tái dùng Page/PageSize.
    ScheduleAssetRef:
      name: asset_ref
      in: query
      required: false
