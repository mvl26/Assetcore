        client gửi). Emit lifecycle incident_reported + audit (D2). Critical → asset Out of
        Service (BR-12-04). Cap: corrective.create.
        Responses (G-OAS-STATUSLINE — client ROUTE THEO GIÁ TRỊ body.success + body.http_status,
        KHÔNG HTTP status-line, KHÔNG discriminator-object): 200 = oneOf [ReportIncidentCreatedEnvelope
        (success:true, data ReportIncidentResponse {name,status,severity} imm12.py:410) | Error
        (success:false)] CLOSED-SCHEMA disjoint required-set (Decision-B §5c — route theo
        Created.success.enum=[true] vs Error.success.enum=[false], KHÔNG discriminator); in-handler
        business error 404 (asset∄ IMM12_ASSET_NOT_FOUND
        imm12.py:361) + 422 (BR-12-01 Critical→clinical_impact imm12.py:359) ARRIVE HTTP-200 body
        (route theo body.http_status) — gom vào nhánh Error, KHÔNG status-line key.
        403 = DUAL-SHAPE oneOf Error|FrappeRawError (in-handler cap-403 HTTP-200 + Error{FORBIDDEN}
        imm12.py:96 vs dispatcher-403 HTTP-403 + FrappeRawError — 04 §4 row5/§5/§5b; GIỮ status-line).
      # G-OAS-403-DISAMBIG (P1) — requestBody = $ref-ONLY (gỡ sibling `required:true` ở path-level;
      #   OAS 3.0.3 BỎ QUA mọi sibling cạnh `$ref` → spectral/openapi-generator --strict warning).
      #   `required:true` GIỮ NGUYÊN trong components/requestBodies/ReportIncidentBody (đã set nội bộ).
      requestBody:
        $ref: '#/components/requestBodies/ReportIncidentBody'
      responses:
        # G-OAS-STATUSLINE (P1 contract-correctness) — 200 = oneOf [Created, Error] CLOSED-SCHEMA
        #   disjoint required-set (Decision-B §5c, KHÔNG discriminator). in-handler business error
        #   (404 asset∄ imm12.py:361 / 422 BR-12-01 imm12.py:359)
        #   ARRIVE HTTP status-line 200 + Error body (quirk §5: _err response.py:95-154 + handle()
        #   return dict api_handler.py:48 + hooks.py:405 no after_request → status-line KHÔNG BAO GIỜ
        #   set cho in-handler error). ⇒ 404/422 KHÔNG keyed dưới HTTP-code status-line (dead-deser);
        #   gom vào nhánh Error của 200-oneOf. Client route theo GIÁ TRỊ body.success (Created.enum=[true]
        #   vs Error.enum=[false] qua closed-schema, KHÔNG discriminator) +
        #   body.http_status (404=NOT_FOUND / 422=VALIDATION trong body Error), KHÔNG status-line.
        '200':
          description: >
            200 báo hỏng. oneOf 2 nhánh phân biệt MÁY-ĐỌC bằng CLOSED-SCHEMA + disjoint
            required-set (KHÔNG discriminator — xem G-OAS-NO-BOOL-DISC §5c):
            (a) ReportIncidentCreatedEnvelope {success:true, data:{name,status,severity}} —
            thành công (imm12.py:410, emit incident_reported + audit D2, Critical→Out of Service);
            (b) Error envelope {success:false, code, http_status} — in-handler business error
            arrive HTTP-200 (404 asset∄ imm12.py:361 / 422 BR-12-01 Critical→clinical_impact
            imm12.py:359 / cap-403 imm12.py:96). Route theo body.success/body.http_status, KHÔNG
            HTTP status-line. 2 nhánh additionalProperties:false ⇒ loại-trừ theo required-set
            (Created req[success,data] vs Error req[success,error,code,http_status]).
          content:
            application/json:
              # G-OAS-NO-BOOL-DISC (§5c, Self-Correction R1) — KHÔNG discriminator: OAS 3.x yêu cầu
              #   discriminator.propertyName trỏ property type STRING; `success` là BOOLEAN ⇒
              #   discriminator illegal (generator Dart/Kotlin/Java drop nó + fallback try-each-branch
              #   HOẶC sinh switch(string)==boolean → deser-fail). BỎ block discriminator; 2 nhánh
              #   máy-phân-biệt bằng closed-schema (additionalProperties:false trên CẢ 2) + disjoint
              #   required-set. Client route theo body.success (Created.success.enum=[true] ≠
              #   Error.success.enum=[false]) + body.http_status. Mirror fix R2 (FrappeRawError closed).
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReportIncidentCreatedEnvelope'
                  - $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized401' }
        # G-REQBODY gap-2 — 403 DUAL-SHAPE (in-handler cap-403 HTTP-200+Error ≠ dispatcher-403
        #   HTTP-403+FrappeRawError). KHÁC component Forbidden (single FrappeRawError) — 04 §5/§5b.
        #   GIỮ status-line key 403: dispatcher-403 (guest/no-token) trip TRƯỚC handle() → 403 THẬT.
        '403': { $ref: '#/components/responses/ReportIncidentForbidden' }
        # G-OAS-STATUSLINE — 404/422 DEMOTE thành doc-only note (KHÔNG status-line key): in-handler
        #   arrive HTTP-200 body, route theo body.http_status (NOT_FOUND=404 imm12.py:361 /
        #   VALIDATION=422 imm12.py:359) — đã gom vào nhánh Error của 200-oneOf trên. Component
        #   NotFound404/Unprocessable422 = RESERVED forward-reserve (04 §8.2).

