    # C4 — OIDC userinfo claims (openid_profile). GROUNDED @frappe/oauth.py:530-555
    #   (get_userinfo) — KHÔNG bịa field. 8 claim CHÍNH XÁC: sub/name/given_name/family_name/
    #   email/picture/roles/iss. PASSTHROUGH RAW (openid_profile oauth2.py:163-174 set
    #   frappe.local.response = body trực tiếp ⇒ KHÔNG bọc AssetCore envelope, KHÔNG {message:}).
    #   sub = User Social Login.userid (frappe provider) → CÓ THỂ null nếu user chưa có social-login
    #   record (db.get_value trả None). picture = user.user_image resolve URL → null nếu rỗng
    #   (oauth.py:540-548). roles = frappe.get_roles(user) array<string>. iss = server_url.
    #   Decision-B: closed-schema + additionalProperties:false, KHÔNG discriminator.
    OidcUserInfo:
      type: object
      additionalProperties: false
      description: >
        OIDC userinfo claims trả RAW (passthrough) từ GET openid_profile — KHÔNG bọc envelope
        AssetCore. App field-tech dùng `name` + `roles` để hiển thị danh tính KTV sau đăng nhập
        (đóng mảnh flow-1). Field GROUNDED @frappe/oauth.py:530-555 (get_userinfo).
      properties:
        sub:
          type: string
          nullable: true
          description: >
            Subject identifier = User Social Login.userid (provider=frappe). NULLABLE — null
            khi user chưa có bản ghi social-login (db.get_value trả None, oauth.py:543-547).
        name:
          type: string
          description: 'Họ tên đầy đủ = join(first_name, last_name) (oauth.py:548).'
        given_name:
          type: string
          description: 'Tên = user.first_name (oauth.py:549).'
        family_name:
          type: string
          description: 'Họ = user.last_name (oauth.py:550).'
        email:
          type: string
          format: email
          description: 'Email = user.email (oauth.py:551).'
        picture:
          type: string
          nullable: true
          description: >
            URL ảnh đại diện = user.user_image resolve absolute (oauth.py:531-539,552). NULLABLE —
            null khi user không có ảnh.
        roles:
          type: array
          items: { type: string }
          description: 'Danh sách Role của user = frappe.get_roles(user) (oauth.py:553). App map sang nhãn KTV.'
        iss:
          type: string
          description: 'Issuer = server URL (oauth.py:554).'
      # get_userinfo trả frappe._dict 8 KEY LUÔN HIỆN DIỆN (oauth.py:530-555) — sub/picture có
      #   thể giá trị null (nullable:true) nhưng KEY luôn có ⇒ required đủ 8.
      required: [sub, name, given_name, family_name, email, picture, roles, iss]

    # ─── PushMessageData — flow-6 FCM data-payload (transport NGOÀI HTTP). COMPONENT-ONLY:
    #   KHÔNG referenced bởi BẤT KỲ HTTP path nào (push đi qua FCM HTTP v1, KHÔNG qua REST
    #   AssetCore) ⇒ forward-reserve hợp lệ trong _RESERVED_ORPHANS (test_mobile_oas.py).
    #   GROUNDED 1:1 với `data` map mà `_build_message` emit @utils/fcm.py:94-98 (đúng 4 key,
    #   map<string,string>) + 5 giá trị `event` @services/notifications.py:443-454 `_ROUTES`
    #   + fallback `:451`. Codegen mobile sinh model `PushMessageData` để parse FCM
    #   RemoteMessage.data (client native ĐỌC 4 key này → route deep-link). SSoT prose:
    #   ../06-push-fcm.md §4.1 / §4.1a / §4.2 (đã Self-Correction 2026-06-15: drift
    #   approval_pending/escalation → bỏ; live `_ROUTES` chỉ 5 giá trị).
    #   `android.priority` (high/normal) KHÔNG ∈ schema này — đó là `message.android.priority`
    #   (fcm.py:109, server đặt qua key NỘI BỘ `_priority` đã bị LOẠI khỏi data, fcm.py:89-91),
    #   KHÔNG phải data-key client đọc. additionalProperties:false (closed) + 0 discriminator
    #   (KHÔNG oneOf — schema phẳng 4 string). ───
    PushMessageData:
      type: object
      additionalProperties: false
      description: >
        flow-6 FCM data-payload (FCM HTTP v1 `message.data` — map<string,string>). ĐÚNG 4 key
        routing nghiệp vụ mà `_build_message` emit (utils/fcm.py:94-98); mọi value ÉP về `str`,
        default "" khi rỗng. Client native ĐỌC 4 key này để điều hướng deep-link (KHÔNG render
        từ `notification`). Transport NGOÀI REST (FCM push) ⇒ component-only, KHÔNG gắn HTTP path.
        `android.priority` KHÔNG thuộc payload này (là `message.android.priority`, server-only).
      properties:
        doctype:
          type: string
          description: >
            Loại tài liệu nguồn = `_dispatch` document_type (vd "PM Work Order" / "Incident Report"
            / "Asset Repair" / "AC Asset"). ÉP str, "" khi rỗng (fcm.py:95).
        name:
          type: string
          description: >
            Mã bản ghi nguồn = `_dispatch` document_name (vd "PMWO-2026-0042"). ÉP str, "" khi rỗng
            (fcm.py:96). Dùng dựng deep-link `<name>`.
        event:
          type: string
          description: >
            Loại sự kiện push suy từ `doc.doctype` qua `_push_event_route` (notifications.py:443-454)
            — KHÔNG phải event-code nghiệp vụ E1-E5/SLA (xem ../06-push-fcm.md §4.1a). `notification`
            = fallback khi doctype ngoài 4 map HOẶC `name` rỗng (notifications.py:451). ÉP str (fcm.py:97).
          enum: [incident_created, repair_assigned, pm_assignment, calibration_due, notification]
        deeplink:
          type: string
          description: >
            Custom-scheme deep-link `assetcore://<route>` để APK mở đúng màn. 5 template SSoT khớp
            `_ROUTES` (notifications.py:444-447) + fallback `:451`:
            `assetcore://incident/<name>` (Incident Report) ·
            `assetcore://wo/cm/<name>` (Asset Repair) ·
            `assetcore://wo/pm/<name>` (PM Work Order) ·
            `assetcore://asset/<name>` (AC Asset) ·
            `""` rỗng khi fallback `notification` (doctype khác / name rỗng → APK mở inbox).
            ÉP str (fcm.py:98).
      required: [doctype, name, event, deeplink]

