    # ---------------------------------------------------------------------
    # G-OAS-STATUSLINE (P1 contract-correctness) — Created success-envelope NAMED schemas cho
    #   200-oneOf [<CreatedEnvelope>, Error] của 3 create path (reportIncident/createRepair/createCalibration).
    #   QUYẾT ĐỊNH (route-by-VALUE closed-schema — Decision-B §5c, KHÔNG route-by-status-line, KHÔNG
    #   discriminator-object):
    #     • in-handler business error (404/422 report; 404/409 repair/cal) đi qua `_err`
    #       (response.py:95-154) + `handle()` return dict (api_handler.py:48) → Frappe serialize
    #       HTTP-200 (hooks.py:405 no after_request → status-line KHÔNG BAO GIỜ set cho in-handler
    #       error). ⇒ codegen route-by-status-line KHÔNG bao giờ thấy 404/422/409 → keying chúng
    #       dưới HTTP-code response-key = DEAD-DESER branch. Gom vào nhánh Error của 200-oneOf.
    #     • 200 = oneOf [<CreatedEnvelope>, Error] CLOSED-SCHEMA (additionalProperties:false CẢ 2) +
    #       disjoint required-set ⇒ client route theo GIÁ TRỊ body.success (Created.success.enum=[true]
    #       ≠ Error.success.enum=[false] — phân biệt MÁY-ĐỌC qua closed-schema, KHÔNG cần block
    #       discriminator) + body.http_status (404/422/409 nằm TRONG body Error, §5). 04 §5/§5b/§5c.
    #     • [SUPERSEDED — Decision-B] bản nháp R1 từng đặt discriminator {propertyName: success}; BỎ vì
    #       success là BOOLEAN ⇒ discriminator OAS 3.x illegal (propertyName phải trỏ property STRING) →
    #       generator drop/deser-fail. KHÔNG còn discriminator-object trong spec (0 discriminator-key).
    #   Created envelope = success.enum:[true] GIỮ (giá-trị-route nhánh thành công); data $ref
    #   <X>Response (đã định nghĩa ở trên — KHÔNG đổi). Pre-handler 401/403 GIỮ status-line key
    #   (dispatcher trip TRƯỚC handle() → status-line THẬT) ⇒ symmetry 401/403==12 BẤT BIẾN.
    # ---------------------------------------------------------------------
    ReportIncidentCreatedEnvelope:
      type: object
      # G-OAS-NO-BOOL-DISC (§5c) — additionalProperties:false ⇒ closed-schema. Cùng disjoint
      #   required-set [success,data] (vs Error [success,error,code,http_status]) làm 2 nhánh
      #   200-oneOf LOẠI TRỪ nhau cho codegen (KHÔNG cần discriminator boolean illegal).
      additionalProperties: false
      description: >
        200 success envelope báo hỏng (nhánh thành công). `data` = ReportIncidentResponse
        {name,status,severity} (imm12.py:410). success.enum:[true] + closed-schema phân biệt
        MÁY-ĐỌC với nhánh Error (success.enum:[false]) trong 200-oneOf. G-OAS-STATUSLINE/§5c.
      properties:
        success:
          type: boolean
          enum: [true]
          description: Luôn true cho nhánh Created.
        data:
          $ref: '#/components/schemas/ReportIncidentResponse'
      required: [success, data]
    CreateRepairWorkOrderCreatedEnvelope:
      type: object
      # G-OAS-NO-BOOL-DISC (§5c) — closed-schema + disjoint required-set (xem ReportIncidentCreatedEnvelope).
      additionalProperties: false
      description: >
        200 success envelope tạo phiếu sửa chữa (nhánh thành công). `data` =
        CreateRepairWorkOrderResponse {name,status,sla_target_hours} (imm09.py:786). success.enum:[true]
        + closed-schema phân biệt MÁY-ĐỌC với nhánh Error (success.enum:[false]) trong 200-oneOf. §5c.
      properties:
        success:
          type: boolean
          enum: [true]
          description: Luôn true cho nhánh Created.
        data:
          $ref: '#/components/schemas/CreateRepairWorkOrderResponse'
      required: [success, data]
    CreateCalibrationCreatedEnvelope:
      type: object
