        $ref: '#/components/requestBodies/CreateCalibrationBody'
      responses:
        # G-OAS-STATUSLINE (P1 contract-correctness) — 200 = oneOf [Created, Error] CLOSED-SCHEMA
        #   disjoint required-set (Decision-B §5c, KHÔNG discriminator — route theo GIÁ TRỊ body.success).
        #   in-handler business error (404 asset∄ imm11.py:999 / 409 ASSET_BLOCKED CAL-008
        #   imm11.py:1002) ARRIVE HTTP status-line 200 + Error body (quirk §5: _err response.py:95-154
        #   + handle() return dict api_handler.py:48 + hooks.py:405 no after_request → status-line
        #   KHÔNG set). ⇒ 404/409 KHÔNG keyed dưới HTTP-code status-line (dead-deser); gom nhánh Error.
        '200':
          description: >
            200 tạo phiếu hiệu chuẩn. oneOf 2 nhánh phân biệt MÁY-ĐỌC bằng CLOSED-SCHEMA + disjoint
            required-set (KHÔNG discriminator — §5c):
