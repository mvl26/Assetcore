    # A3 — responses tái dùng cho lỗi IN-HANDLER nghiệp vụ (Error envelope, HTTP-200 quirk §5):
    #   Conflict409 / NotFound404 / Unprocessable422 (trỏ Error envelope).
    # A16 — TÁCH status-class pre-handler: 401/403/429 trip TRƯỚC handle() ⇒ body THẬT = raw
    #   Frappe (FrappeRawError), HTTP status LINE THẬT. Repoint Unauthorized401 + Forbidden +
    #   RateLimited429 từ schemas/Error → schemas/FrappeRawError (KHỚP body runtime, codegen KHÔNG
    #   deser-fail). Error envelope CHỈ áp lỗi in-handler. Chi tiết: ../04-api-contract.md §5 + §5b.
    #     401 = Authorization header CÓ nhưng bearer hết-hạn/invalid + session=Guest
    #           (AuthenticationError, frappe/exceptions.py:26-27 status 401; raise auth.py:630).
    #     403 = guest/no-token HOẶC method thiếu permission/capability ở dispatcher
    #           (PermissionError, frappe/exceptions.py:34-35 status 403; raise is_whitelisted __init__.py:876).
    #     429 = vượt @rate_limit (TooManyRequestsError, frappe/exceptions.py:80 status 429).
    Forbidden:
      description: >
        403 — guest/no-token HOẶC method thiếu permission/capability (PermissionError raw,
        frappe/exceptions.py:34-35; raise is_whitelisted __init__.py:876). Body raw Frappe
        (FrappeRawError, KHÔNG Error envelope). HTTP status LINE = 403 THẬT (trip TRƯỚC handle()).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FrappeRawError'
    # ─── G-REQBODY (gap-2 403 DUAL-SHAPE) — 403 BÁO HỎNG có HAI nhánh KHÁC NHAU ───
    #   reportIncident là path field-tech gặp 403 PHỔ BIẾN NHẤT (persona corrective.read-only
    #   quét QR → 'Báo hỏng'). 403 ở đây KHÔNG đồng-shape với 11 path khác:
    #   (a) DISPATCHER-403 (guest/no-token): is_whitelisted __init__.py:876 raise PermissionError
    #       TRƯỚC handler ⇒ HTTP status-line 403 THẬT + body FrappeRawError (exc_type=PermissionError)
    #       ⇒ client RE-AUTH (không có bearer để refresh).
    #   (b) IN-HANDLER cap-403 (bearer hợp lệ, thiếu cap 'corrective.create'): imm12.py:95-96
    #       `_err(_MSG_FORBIDDEN, 403)` qua handle()/_err ⇒ HTTP-200 (quirk §5) + Error envelope
    #       {success:false, code:'FORBIDDEN', http_status:403} ⇒ client SHOW-MESSAGE, KHÔNG re-auth.
    #   Codegen route theo HTTP status-line: (a)=403-line, (b)=200-line. Khai oneOf BOTH shape để
    #   client deser được CẢ HAI (nếu chỉ FrappeRawError → (b) deser-fail; nếu chỉ Error → (a) fail).
    #   ⚠️ in-handler cap-403 ≠ Forbidden response component (Forbidden = CHỈ dispatcher-403
    #   FrappeRawError, áp 11 path còn lại). Chi tiết: 04 §4 row5 + §5/§5b.
    ReportIncidentForbidden:
      description: >
        403 báo hỏng — HAI nhánh MÁY-PHÂN-BIỆT: (a) dispatcher-403 (guest/no-token) = HTTP status-line
        403 THẬT + FrappeRawError (PermissionError, is_whitelisted __init__.py:876) → client RE-AUTH;
        (b) in-handler cap-403 (bearer hợp lệ, thiếu cap corrective.create) = HTTP-200 quirk §5 +
        Error envelope {success:false,error,code:FORBIDDEN,http_status:403} (imm12.py:95-96 _err) →
        client SHOW-MESSAGE KHÔNG re-auth. ROUTING: client native PHÂN NHÁNH theo (a) HTTP STATUS-LINE
        THẬT (403-line=dispatcher raw / 200-line=in-handler Error) — KHÔNG anyMatch oneOf; (b) SHAPE
        làm tầng phụ — FrappeRawError đặt additionalProperties:false (closed) ⇒ Error envelope (mang
        key ngoài 4 raw-key) KHÔNG validate-pass FrappeRawError, raw {exc_type,...} KHÔNG validate-pass
        Error (thiếu required success/error/code/http_status) → 2 nhánh oneOf LOẠI TRỪ nhau, codegen
        deser route ĐÚNG. KHÁC component Forbidden (chỉ dispatcher-403, single FrappeRawError).
        04 §4 row5 + §5/§5b + ADR-MOBILE-001 (f).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/FrappeRawError'
    Unauthorized401:
      description: >
        401 — Authorization header CÓ nhưng bearer hết-hạn/invalid (session resolve = Guest)
        (AuthenticationError raw, frappe/exceptions.py:26-27; raise auth.py:630). Body raw
        Frappe (FrappeRawError, KHÔNG Error envelope). HTTP status LINE = 401 THẬT → app
        refresh token; refresh fail → re-auth. (Guest/no-token = 403 Forbidden, KHÔNG 401.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FrappeRawError'
    NotFound404:
      description: 404 — tài nguyên không tồn tại. code=NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict409:
      # A6 reuse: optimistic-lock xung đột (../07-offline-sync.md §4) DÙNG LẠI response này
      #   với code=CONFLICT (server-wins + báo user). KHÔNG thêm mã/response mới.
      description: 409 — trùng lặp / xung đột trạng thái / optimistic-lock lệch. code=CONFLICT|BAD_STATE|DUPLICATE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    # A6 — read-cache conditional GET (../07-offline-sync.md §2). Body RỖNG; chỉ trả header validator.
    NotModified304:
      description: >
        304 Not Modified — bản cache còn mới (If-None-Match/If-Modified-Since khớp). Body RỖNG;
        app DÙNG cache + chỉ refresh cờ "cập nhật lúc…". ../07-offline-sync.md §2. Phase E wire vào path read.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
    Unprocessable422:
      description: 422 — vi phạm nghiệp vụ / validation. code=VALIDATION|BUSINESS_RULE|COMPLIANCE_BLOCKED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited429:
      # A16 — body raw Frappe (TooManyRequestsError, frappe/exceptions.py:80 status 429), KHÔNG Error envelope.
      #   P2 DEFER (KHÔNG bịa hợp đồng): KHÔNG khai Retry-After / X-RateLimit-* là header guaranteed.
      #   Source-verified: site_config KHÔNG có key `rate_limit` ⇒ frappe.local.rate_limiter KHÔNG
      #   instantiate (rate_limiter.py:82-92 chỉ chạy khi conf.rate_limit set) ⇒ @rate_limit decorator
      #   (imm00.py:311/354) emit ZERO backoff-header. Typed backoff headers = Phase-B-conditional
      #   (cần set conf.rate_limit HOẶC nginx limit_req inject Retry-After) → 04 §5 + open_issues.
      description: >
        429 — vượt @rate_limit (TooManyRequestsError raw, frappe/exceptions.py:80 status 429;
        trip TRƯỚC handle()). Body raw Frappe (FrappeRawError, KHÔNG Error envelope). HTTP status
        LINE = 429 THẬT → app backoff + retry. Retry-After/X-RateLimit-* = Phase-B-conditional
        (conf.rate_limit=null hiện tại ⇒ KHÔNG guaranteed — 04 §5).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FrappeRawError'
    # B1 — AUTH-SECTION 400 (PASSTHROUGH OAuthlib, KHÔNG Error envelope). Wire CHỈ lên getOAuthToken.
    #   grant-fail: wrong PKCE verifier / expired code / invalid_grant refresh (oauth2.py:132-135,
    #   oauthlib errors.py:80-88/301). Quyết định passthrough: 03 §2.3.1 + 04 §5b.
    OAuthError400:
      description: >
        400 — OAuth2 grant lỗi (PASSTHROUGH NGUYÊN body provider, KHÔNG AssetCore envelope).
        wrong PKCE verifier / expired/used authorization code / invalid|revoked refresh_token →
        `error=invalid_grant`. Body shape = OAuthlib (RFC 6749 §5.2), client parse theo `error`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError400'

  # ---------------------------------------------------------------------
  # Phase-C — requestBodies (reusable). ReportIncidentBody = wrapper $ref schema
  #   ReportIncidentRequest. Wire NGAY vào path reportIncident.post ⇒ KHÔNG orphan.
  # G-REQBODY (gap-1 CONTENT-TYPE) — content khai oneOf 2 media-type cùng 1 $ref schema:
  #   • application/x-www-form-urlencoded — đường MẶC ĐỊNH của Frappe RPC /api/method:
  #     dispatcher đọc form_dict (query-string / form-encoded), KHÔNG body JSON tự-parse
  #     (frappe/handler.py::handle → frappe.form_dict). curl `-d k=v` (KHÔNG -H Content-Type)
  #     ⇒ form-encoded ⇒ 4 field tới handler ĐÚNG.
  #   • application/json — CHỈ parse khi client set tường minh Content-Type: application/json
  #     (Frappe parse JSON body vào form_dict khi header khớp). Codegen JSON-only client PHẢI
  #     set header này; nếu KHÔNG → field tới handler RỖNG → 'thiếu field' (gap-1 root cause).
  #   ⇒ Khai CẢ HAI để codegen sinh client gọi đúng kiểu Frappe RPC (04 §4/§9 note form_dict).
  # ---------------------------------------------------------------------
  requestBodies:
    ReportIncidentBody:
      required: true
      description: >
        Body báo hỏng — bắt buộc 4 field (asset/incident_type/severity/description). Content
        khai oneOf application/json + application/x-www-form-urlencoded (CÙNG $ref
        ReportIncidentRequest) — Frappe RPC /api/method đọc form_dict (form-encoded mặc định,
        hoặc set Content-Type:application/json tường minh). Xem 04 §4/§9.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportIncidentRequest'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/ReportIncidentRequest'
    # C-REQBODY-CREATEREPAIR — body yêu cầu sửa chữa. Mirror đúng pattern ReportIncidentBody:
    #   content oneOf application/json + application/x-www-form-urlencoded (CÙNG $ref
    #   CreateRepairWorkOrderRequest). Frappe RPC /api/method đọc form_dict (form-encoded mặc
    #   định) ⇒ codegen JSON-only client gửi field tới handler RỖNG → 'thiếu field'. Xem 04 §4/§5b/§9.
    CreateRepairWorkOrderBody:
      required: true
      description: >
        Body yêu cầu sửa chữa — bắt buộc 4 field (asset_ref/repair_type/priority/
        failure_description). Content khai oneOf application/json +
        application/x-www-form-urlencoded (CÙNG $ref CreateRepairWorkOrderRequest) — Frappe RPC
        /api/method đọc form_dict (form-encoded mặc định, hoặc set Content-Type:application/json
        tường minh). Xem 04 §4/§9.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateRepairWorkOrderRequest'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/CreateRepairWorkOrderRequest'
    # C-REQBODY-CREATECAL — body yêu cầu hiệu chuẩn. Mirror đúng pattern CreateRepairWorkOrderBody:
    #   content oneOf application/json + application/x-www-form-urlencoded (CÙNG $ref
    #   CreateCalibrationRequest). Frappe RPC /api/method đọc form_dict (form-encoded mặc định)
    #   ⇒ codegen JSON-only client gửi field tới handler RỖNG → 'thiếu field'. Xem 04 §4/§9.
    CreateCalibrationBody:
      required: true
      description: >
        Body yêu cầu hiệu chuẩn — bắt buộc 4 field (asset/calibration_type/scheduled_date/
        technician). Content khai oneOf application/json + application/x-www-form-urlencoded
        (CÙNG $ref CreateCalibrationRequest) — Frappe RPC /api/method đọc form_dict (form-encoded
        mặc định, hoặc set Content-Type:application/json tường minh). Xem 04 §4/§9.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateCalibrationRequest'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/CreateCalibrationRequest'
    # D4 — body device-token (register/unregister). Mirror pattern CreateCalibrationBody:
    #   content oneOf application/json + application/x-www-form-urlencoded (CÙNG $ref
    #   DeviceTokenRequest). Frappe RPC /api/method đọc form_dict (form-encoded mặc định) ⇒ codegen
    #   JSON-only client gửi field tới handler RỖNG → 'thiếu FCM token'. unregister DÙNG CHUNG body
    #   (chỉ đọc fcm_token; platform/label/version bỏ qua). Xem 04 §4/§8.7 + ../06-push-fcm.md §2.3.
    DeviceTokenBody:
      required: true
      description: >
        Body device-token — bắt buộc fcm_token (register thêm platform enum android/ios). Content
        khai oneOf application/json + application/x-www-form-urlencoded (CÙNG $ref DeviceTokenRequest)
        — Frappe RPC /api/method đọc form_dict (form-encoded mặc định, hoặc set Content-Type:
        application/json tường minh). KHÔNG có `user` (server ÉP session, §6.2). Xem 04 §8.7.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceTokenRequest'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/DeviceTokenRequest'

# Mặc định mọi endpoint nghiệp vụ cần bearer (OAuth flow endpoint tự allow_guest).
security:
  - OAuth2: [all]

# ---------------------------------------------------------------------
# PATHS — STUB 6 luồng field-tech MVP (D-MVP). Tham chiếu endpoint thật.
# Phase C: bồi parameters + requestBody + responses chi tiết cho từng cái.
# ---------------------------------------------------------------------
paths:

  # (1) Đăng nhập OAuth2 — flow endpoint (allow_guest, KHÔNG cần bearer).
  # Auth-section BỒI (A2): params/requestBody chính. Chi tiết: ../03-auth-oauth2.md §1.
  /api/method/frappe.integrations.oauth2.authorize:
    get:
      tags: [auth]
      operationId: authorizeOAuth
      summary: '[MVP-1 / step b] OAuth2 Authorize (Auth Code + PKCE S256)'
      description: >
        Bước (b) đăng nhập. Mở trong WebView/Custom Tab. Guest → 302 /login
        (oauth2.py:79-82); sau login lưu code_challenge (oauth.py:89-91) → 302 về
        redirect_uri?code=... allow_guest=True (oauth2.py:74-75).
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema: { type: string }
          description: client_id của OAuth Client (Phase B tạo).
        - name: response_type
          in: query
          required: true
          schema: { type: string, enum: [code] }
          description: Bắt buộc 'code' (Authorization Code).
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string }
          description: Custom-scheme native, vd assetcore://oauth/callback. Phải khớp redirect_uris đã đăng ký.
        - name: scope
          in: query
          required: false
          schema: { type: string, default: 'all openid' }
          description: Coarse on/off; quyền thực = RBAC capability (xem 03-auth-oauth2.md §3).
        - name: code_challenge
          in: query
          required: true
          schema: { type: string }
          description: BASE64URL-no-pad(SHA256(code_verifier)).
        - name: code_challenge_method
          in: query
          required: true
          schema: { type: string, enum: [S256] }
          description: S256 (verify oauth.py:157-164). Nhánh plain (oauth.py:166) KHÔNG dùng cho native.
      responses:
        '302':
          description: Redirect tới /login (Guest) hoặc về redirect_uri?code=<authcode>.
  /api/method/frappe.integrations.oauth2.get_token:
    post:
      tags: [auth]
      operationId: getOAuthToken
      summary: '[MVP-1 / step c+e] Đổi code→token / refresh token'
      description: >
        Bước (c) grant_type=authorization_code (kèm code_verifier — PKCE verify
        oauth.py:146-164) HOẶC bước (e) grant_type=refresh_token. Trả
        access_token+refresh_token+expires_in(=3600)+token_type=Bearer. allow_guest=True
        (oauth2.py:123-124). grant hợp lệ: oauth.py:187.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                  description: authorization_code (step c) hoặc refresh_token (step e).
                code:
                  type: string
                  description: Authorization code (chỉ khi grant_type=authorization_code).
                code_verifier:
                  type: string
                  description: PKCE verifier gốc (chỉ khi grant_type=authorization_code).
                redirect_uri:
                  type: string
                  description: Phải khớp bước authorize (chỉ khi authorization_code).
                client_id:
                  type: string
                refresh_token:
                  type: string
                  description: Refresh token (chỉ khi grant_type=refresh_token).
              required: [grant_type]
      responses:
        '200':
          # SOURCE-CHARACTERIZED keys (oauthlib BearerToken.create_token tokens.py:309-326;
          #   set frappe.local.response oauth2.py:137). PASSTHROUGH — KHÔNG AssetCore envelope.
          #   access_token+expires_in+token_type LUÔN có; scope khi request có scopes (tokens.py:318-319);
          #   refresh_token khi grant cấp refresh (tokens.py:321-326). expires_in=3600 default (oauth2.py
          #   KHÔNG override; tokens.py:290 `expires_in or 3600`).
          description: Token response (access_token/expires_in/token_type + scope?/refresh_token? — OAuthlib passthrough).
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  expires_in: { type: integer, example: 3600 }
                  token_type: { type: string, example: Bearer }
                  scope: { type: string, example: 'all openid' }
                required: [access_token, expires_in, token_type]
        # B1 — grant FAIL (wrong PKCE verifier / expired code / invalid_grant refresh). PASSTHROUGH
        #   OAuthlib body (oauth2.py:132-135 → errors.py:80-88), KHÔNG Error envelope. CHỈ wire ở đây
        #   (token-issuance grant). KHÔNG wire 400 lên authorize (302-only) / revoke (RFC7009 luôn 200).
        '400':
          $ref: '#/components/responses/OAuthError400'
  /api/method/frappe.integrations.oauth2.revoke_token:
    post:
      tags: [auth]
      operationId: revokeOAuthToken
      summary: '[MVP-1 / step f] Thu hồi token (logout/mất máy)'
      description: 'RFC 7009. Set status="Revoked" (oauth.py:259-265). allow_guest=True (oauth2.py:144-145).'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: access_token hoặc refresh_token cần thu hồi.
                token_type_hint:
                  type: string
                  enum: [access_token, refresh_token]
                  description: Gợi ý loại token (tuỳ chọn).
              required: [token]
      responses:
        '200':
          # B1 — SOURCE-CHARACTERIZED: revoke_token LUÔN trả 200 với body RỖNG (empty object).
          #   oauth2.py:158-159 `frappe.local.response = frappe._dict({})` + `http_status_code = status or 200`.
          #   RFC 7009 §2.2: server trả 200 kể cả token không tồn tại / lỗi (except…pass oauth2.py:154-155).
          #   PASSTHROUGH — KHÔNG AssetCore envelope. KHÔNG có 400 (mọi lỗi nuốt → vẫn 200).
          description: Thu hồi thành công (RFC 7009 — luôn 200 kể cả token không tồn tại; body rỗng).
          content:
            application/json:
              schema:
                type: object
                description: Body RỖNG (empty object) — RFC 7009 luôn 200 (oauth2.py:158-159).
                additionalProperties: false

  # (1g) C4 — OIDC userinfo / "whoami". App lấy danh tính (tên + role) sau đăng nhập (flow-1).
  #   @frappe.whitelist() KHÔNG allow_guest (oauth2.py:163) ⇒ BẮT BUỘC bearer + scope openid.
  #   openid_profile set frappe.local.response = claims dict (oauth2.py:172-174) ⇒ PASSTHROUGH RAW,
  #   KHÔNG bọc AssetCore envelope / {message:}. Refresh-on-401: 401 → getOAuthToken
  #   grant_type=refresh_token → retry (xem ../03-auth-oauth2.md §userinfo + ../04-api-contract.md §9).
  /api/method/frappe.integrations.oauth2.openid_profile:
    get:
      tags: [auth]
      operationId: getUserInfo
      summary: '[MVP-1 / step e] OIDC userinfo (whoami) — danh tính KTV sau đăng nhập'
      description: >
        GET. Trả OIDC userinfo claims của user gắn với access_token đang dùng (get_userinfo
        oauth.py:530-555 qua create_userinfo_response oauth2.py:167). BẮT BUỘC bearer hợp lệ +
        scope `openid` (whitelist KHÔNG allow_guest oauth2.py:163) — guest/no-token → dispatcher-401.
        Response 200 = OidcUserInfo RAW (oauth2.py:172-174 frappe.local.response = body) —
        PASSTHROUGH, KHÔNG bọc envelope AssetCore (giống pattern OAuth token §5 passthrough).
        App dùng `name` + `roles` hiển thị danh tính KTV. 401 → refresh-on-401 (getOAuthToken
        grant_type=refresh_token → retry); refresh fail → re-auth.
      security:
        - OAuth2: [openid]
      responses:
        '200':
          description: 'Danh tính (OIDC claims) RAW — KHÔNG envelope (oauth2.py:172-174).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcUserInfo'
        '401': { $ref: '#/components/responses/Unauthorized401' }

  # (2) Quét QR → hồ sơ thiết bị. asset.read. imm00.py.
  /api/method/assetcore.api.imm00.resolve_qr_token:
    get:
      tags: [asset]
      operationId: resolveQrToken
      summary: '[MVP-2] Resolve QR token → asset (typed — R4 §8.7)'
      description: >
        App tự decode QR + parse token khỏi URL /a/<token> (native KHÔNG dùng deep-link SPA).
        GET ?token=<...>. Cap: asset.read (rbac.require imm00.py:356 — dispatcher-403 single-shape).
        200 = oneOf [QrResolveEnvelope (success:true) | Error (success:false)] — CLOSED-SCHEMA
        Decision-B KHÔNG discriminator (C6 read-path P1 closure, mirror create §5c). In-handler
        business error ARRIVE HTTP-200 body (route theo body.success/body.http_status, KHÔNG
        status-line): 404 (token rỗng/không khớp asset, leak-safe imm00.py:366 _err 404) +
        vendor-IDOR-403 (assert_vendor_can_access → ServiceError(FORBIDDEN) caught → _err imm00.py:371
        ⇒ HTTP-200+Error{code:FORBIDDEN}). dispatcher-403 (guest/thiếu DocPerm rbac.require asset.read
        imm00.py:362) GIỮ status-line key 403 (trip TRƯỚC handle()).
      responses:
        '200':
          description: >
            200 resolve QR. oneOf 2 nhánh phân biệt MÁY-ĐỌC bằng CLOSED-SCHEMA + disjoint required-set
            (KHÔNG discriminator — C6 §5c read-path): (a) QrResolveEnvelope {success:true, data}
            — resolve thành công (services/imm00.py:303); (b) Error {success:false, code, http_status}
            — in-handler 404 (token∄ imm00.py:366) / vendor-IDOR-403 (imm00.py:371) arrive HTTP-200.
            Route theo body.success/body.http_status. 2 nhánh additionalProperties:false ⇒ loại-trừ
            theo required-set (QrResolve req[success,data] vs Error req[success,error,code,http_status]).
          content:
            application/json:
              # C6 (read-path P1 closure) — 200 = oneOf [QrResolveEnvelope, Error] closed-schema,
              #   KHÔNG discriminator (success=boolean → discriminator OAS 3.x illegal; mirror create §5c).
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QrResolveEnvelope'
                  - $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized401' }
        '403': { $ref: '#/components/responses/Forbidden' }
        # @rate_limit VERIFIED @source imm00.py:311 (resolve, 30/60s/IP) — 429 trip TRƯỚC handler (04 §5 line 143).
        '429': { $ref: '#/components/responses/RateLimited429' }
  /api/method/assetcore.api.imm00.get_asset_scan_info:
    get:
      tags: [asset]
