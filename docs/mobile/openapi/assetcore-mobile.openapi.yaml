        Responses (G-OAS-STATUSLINE — client ROUTE THEO GIÁ TRỊ body.success + body.http_status,
        KHÔNG HTTP status-line, KHÔNG discriminator-object): 200 = oneOf [ReportIncidentCreatedEnvelope
        (success:true, data ReportIncidentResponse {name,status,severity} imm12.py:410) | Error
        (success:false)] CLOSED-SCHEMA disjoint required-set (Decision-B §5c — route theo
        Created.success.enum=[true] vs Error.success.enum=[false], KHÔNG discriminator); in-handler
        business error 404 (asset∄ IMM12_ASSET_NOT_FOUND
        imm12.py:361) + 422 (BR-12-01 Critical→clinical_impact imm12.py:359) ARRIVE HTTP-200 body
        (route theo body.http_status) — gom vào nhánh Error, KHÔNG status-line key.
        403 = DUAL-SHAPE oneOf Error|FrappeRawError (in-handler cap-403 HTTP-200 + Error{FORBIDDEN}
        imm12.py:96 vs dispatcher-403 HTTP-403 + FrappeRawError — 04 §4 row5/§5/§5b; GIỮ status-line).
