        nhận đã tiếp nhận thiết bị điều chuyển, chuyển Asset Transfer Approved → Received (svc.confirm_receipt
        @services/imm00.py:2677-2708). Set status=_TRANSFER_STATUS_RECEIVED ('Received' @:2564,2687), received_by=
