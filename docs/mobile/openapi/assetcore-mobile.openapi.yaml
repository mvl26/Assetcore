            (imm11.py:1015, status init "Scheduled" imm11.py:1013 + audit D2); (b) Error envelope
            {success:false, code, http_status} — in-handler business error arrive HTTP-200 (404 asset∄
            imm11.py:999 / 409 ASSET_BLOCKED lifecycle-conflict CAL-008 imm11.py:1002, http_status 409
            messages.py:860). Route theo body.success/body.http_status, KHÔNG HTTP status-line.
            2 nhánh additionalProperties:false ⇒ loại-trừ theo required-set.
          content:
            application/json:
              # G-OAS-NO-BOOL-DISC (§5c) — BỎ discriminator boolean illegal (xem report_incident).
              #   2 nhánh máy-phân-biệt bằng closed-schema + disjoint required-set.
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CreateCalibrationCreatedEnvelope'
                  - $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized401' }
        # C-REQBODY-CREATECAL — 403 SINGLE-SHAPE (rbac.require → frappe.throw PermissionError
