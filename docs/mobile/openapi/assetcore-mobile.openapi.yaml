            (imm11.py:1015, status init "Scheduled" imm11.py:1013 + audit D2); (b) Error envelope
            {success:false, code, http_status} — in-handler business error arrive HTTP-200 (404 asset∄
            imm11.py:999 / 409 ASSET_BLOCKED lifecycle-conflict CAL-008 imm11.py:1002, http_status 409
