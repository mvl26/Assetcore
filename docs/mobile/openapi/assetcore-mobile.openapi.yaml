      #   OAS 3.0.3 BỎ QUA mọi sibling cạnh `$ref` → spectral/openapi-generator --strict warning).
      #   `required:true` GIỮ NGUYÊN trong components/requestBodies/ReportIncidentBody (đã set nội bộ).
      requestBody:
        $ref: '#/components/requestBodies/ReportIncidentBody'
      responses:
        # G-OAS-STATUSLINE (P1 contract-correctness) — 200 = oneOf [Created, Error] CLOSED-SCHEMA
        #   disjoint required-set (Decision-B §5c, KHÔNG discriminator). in-handler business error
        #   (404 asset∄ imm12.py:361 / 422 BR-12-01 imm12.py:359)
        #   ARRIVE HTTP status-line 200 + Error body (quirk §5: _err response.py:95-154 + handle()
        #   return dict api_handler.py:48 + hooks.py:405 no after_request → status-line KHÔNG BAO GIỜ
