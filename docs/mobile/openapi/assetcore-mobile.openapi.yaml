    #   `return {"name": name, "status": doc.status, "rca_created": rca_name}` với
    #   `rca_name: str | None = None` (@:519) — None khi severity Low/Medium HOẶC RCA-create raise
    #   (try/except nuốt @:520-524). ⇒ rca_created = string|null nullable. Pattern §8.10 mục (c)
    #   forward-reserve: "data khác {name,status} → schema *ActionResponse mới" → GIỮ envelope acknowledge/
    #   startWork BẤT BIẾN closed 2-key.
