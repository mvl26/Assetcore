        (success.enum:[false]) trong 200-oneOf. Route-by-VALUE body.success (C6/C7) — KHÔNG discriminator.
      properties:
        success:
          type: boolean
          enum: [true]
          description: Luôn true cho nhánh action-success.
        data:
          $ref: '#/components/schemas/IncidentActionResponse'
      required: [success, data]
