      summary: '[MVP-3] Báo hỏng thiết bị — Phase-C requestBody + response (G-REQBODY)'
      description: >
        POST-only. Path Phase-C ĐẦU TIÊN rời STUB; G-REQBODY đóng 4 contract-gap codegen.
        requestBody THẬT (4 field bắt buộc, @incident_report.json + imm12.py:71-84) — content
        oneOf application/json + application/x-www-form-urlencoded (Frappe RPC đọc form_dict,
        04 §4/§9). source=mobile coerce NGOÀI requestBody (server gán 'qr-scan'/'manual', KHÔNG
        client gửi). Emit lifecycle incident_reported + audit (D2). Critical → asset Out of
