      # G-OAS-403-DISAMBIG (P1) — requestBody = $ref-ONLY (gỡ sibling `required:true`; OAS 3.0.3 bỏ
      #   qua sibling cạnh `$ref`). `required:true` GIỮ trong components/requestBodies/CreateCalibrationBody.
